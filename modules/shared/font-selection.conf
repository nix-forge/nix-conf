<!-- Google Fonts includes an older emoji face and a compatibility test face.
  Prefer the dedicated Noto Color Emoji package, including outside the
  interactive user's Home Manager profile. -->
<selectfont>
  <rejectfont>
    <glob>*/share/fonts/truetype/NotoColorEmoji-Regular.ttf</glob>
    <glob>*/share/fonts/truetype/NotoColorEmojiCompatTest-Regular.ttf</glob>
  </rejectfont>
</selectfont>
