rules:
  - id: rust-tls-verification-disabled
    languages: [rust]
    severity: ERROR
    message: Keep TLS certificate and hostname verification enabled.
    pattern-either:
      - pattern: $BUILDER.danger_accept_invalid_certs(true)
      - pattern: $BUILDER.danger_accept_invalid_hostnames(true)
  - id: rust-unbounded-async-channel
    languages: [rust]
    severity: ERROR
    message: Give asynchronous message queues an explicit finite capacity.
    pattern-either:
      - pattern: $MODULE::unbounded_channel(...)
      - pattern: $MODULE::unbounded_channel::<$T>(...)
      - pattern: tokio::sync::mpsc::unbounded_channel(...)
      - pattern: futures::channel::mpsc::unbounded(...)
      - pattern: futures_channel::mpsc::unbounded(...)
      - pattern: crossbeam_channel::unbounded(...)
      - pattern: crossbeam_channel::unbounded::<$T>(...)
      - pattern: futures::channel::mpsc::unbounded::<$T>(...)
      - pattern: futures_channel::mpsc::unbounded::<$T>(...)
  - id: rust-websocket-limit-disabled
    languages: [rust]
    severity: ERROR
    message: Give WebSocket messages and frames finite size limits.
    pattern-either:
      - pattern: $CONFIG.max_message_size(None)
      - pattern: $CONFIG.max_frame_size(None)
      - pattern: $CONFIG.max_message_size = None
      - pattern: $CONFIG.max_frame_size = None
      - pattern: '$CONFIG { max_message_size: None, ..$REST }'
      - pattern: '$CONFIG { max_frame_size: None, ..$REST }'
