# Live advisory data is checked separately by `just rust-audit`.
[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[licenses]
confidence-threshold = 0.95
allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "MIT-0",
  "CDLA-Permissive-2.0",
  "Zlib",
]

# Existing HTML/CSS parsing dependencies carry file-level copyleft licenses.
# Keep permission scoped to the reviewed packages and locked versions.
exceptions = [
  { name = "cssparser", version = "=0.38.0", allow = [
    "MPL-2.0",
  ] },
  { name = "cssparser-macros", version = "=0.7.1", allow = [
    "MPL-2.0",
  ] },
  { name = "dtoa-short", version = "=0.3.5", allow = [
    "MPL-2.0",
  ] },
  { name = "selectors", version = "=0.41.0", allow = [
    "MPL-2.0",
  ] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  { name = "openssl-sys", reason = "HTTP clients use the pinned rustls transport" },
  { name = "native-tls", reason = "Native TLS requires an explicit dependency review" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
required-git-spec = "rev"
