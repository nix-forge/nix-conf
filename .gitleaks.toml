title = "nix-conf Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
targetRules = ["jwt"]
condition = "AND"
regexTarget = "line"
description = "Spotify CDN signed download URLs are public, short-lived artifact URLs generated by SpotX."
paths = ['''(^|/)spotify-spotx/source\.nix$''']
regexes = [
  '''^\s*url\s*=\s*"https://upgrade\.scdn\.co/upgrade/client/osx-arm64/spotify-autoupdate-[0-9A-Za-z.-]+\.tbz\?fauth=[A-Za-z0-9._-]+";\s*$''',
]

[[allowlists]]
description = "Historical deployment metadata uses cacheKey for public SHA-256 content hashes."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)(nix-seal\.lock\.json|\.nix-seal/public\.nix)$''']
regexes = ['''cacheKey[" ]*[:=]\s*"[0-9a-f]{64}"''']

[[allowlists]]
description = "Historical resolver lists use these reviewed public minisign verification keys."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = [
  '''(^|/)(_nixOSModules|nixosModules)/(hardware/)?networking/dnscrypt-proxy\.nix$''',
]
regexes = [
  '''^minisign_key = "RWQf6LRCGA9i53mlYecO4IsT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3"$''',
]

[[allowlists]]
description = "The historical secret helper's allow_derived flag is a boolean argument."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)scripts/secret[c]tl\.py$''']
regexes = ['''^secret_id, allow_derived=True$''']

[[allowlists]]
description = "Reviewed publication metadata in six immutable historical commits; credential rules remain active."
targetRules = [
  "docs-personal-home-path",
  "docs-personal-email",
  "hardware-disk-identity",
  "docs-hardware-address",
]
commits = [
  "081cb5b2b22ecc2866a56067d6d955a8ea8851a2",
  "1cbf37ba4f39f73ea66c25aade57fd284d20e1b0",
  "22c22b8c700e1c741e5c9cdab58885419f77c62e",
  "62f4b52ccfbce77c2777f84ff7a6c5eeac4d0ef1",
  "63519d7c5a78d2ce90002a6efda523d171760339",
  "9ccc72b575df780dda48d4160b028e7f0f1fc1f2",
]

[[rules]]
id = "docs-personal-home-path"
description = "Use portable home-directory placeholders in public documentation."
path = '''(^|/)docs/'''
regex = '''(?:^|[\s"'`=:(])/(?:Users|home)/[A-Za-z0-9][A-Za-z0-9._-]*/'''
[[rules.allowlists]]
description = "Explicitly fictional users in portable examples."
regexTarget = "match"
regexes = ['''/(?:Users|home)/(?:example|user|check-user)/''']

[[rules]]
id = "docs-personal-email"
description = "Use public noreply addresses or example.org in documentation."
path = '''(^|/)docs/'''
regex = '''(?i)[a-z0-9._%+-]+@(?:gmail\.com|googlemail\.com|icloud\.com|me\.com|hotmail\.com|outlook\.com|proton\.me|protonmail\.com)\b'''

[[rules]]
id = "hardware-disk-identity"
description = "Supply physical disk identifiers through private installer configuration."
regex = '''/dev/disk/by-id/(?:nvme|ata|scsi|wwn|usb)-[A-Za-z0-9_.:-]+'''

[[rules]]
id = "docs-hardware-address"
description = "Use a placeholder for hardware addresses in public documentation."
path = '''(^|/)docs/'''
regex = '''(?i)\b(?:[0-9a-f]{2}:){5}[0-9a-f]{2}\b'''
