title = "nix-conf Gitleaks configuration"

[[allowlists]]
description = "The nix-seal lock and public policy files contain public recipients, verification keys, and content hashes only."
paths = ['''(^|/)nix-seal\.lock\.json$''', '''(^|/)\.nix-seal/public\.nix$''']

[[allowlists]]
description = "Spotify CDN signed download URLs are public, short-lived artifact URLs generated by SpotX."
paths = ['''(^|/)spotify-spotx/source\.nix$''']
regexes = [
  '''https://upgrade\.scdn\.co/upgrade/client/osx-arm64/spotify-autoupdate-[^\"]+\.tbz\?fauth=[A-Za-z0-9._-]+''',
]

[[allowlists]]
description = "The secret CLI's boolean option is not a credential."
paths = ['''(^|/)scripts/secretctl\.py$''']
regexes = ['''allow_derived=True''']

[[allowlists]]
description = "DNSCrypt resolver minisign keys are public verification keys published with the resolver lists."
paths = [
  '''(^|/)_?nixOSModules/(hardware/)?networking/dnscrypt-proxy\.nix$''',
  '''(^|/)nixosModules/networking/dnscrypt-proxy\.nix$''',
]
regexes = ['''minisign_key = \"[A-Za-z0-9+/=]+\"''']
