title = "nix-conf historical credential scan"

# Publication rules apply to the committed tree and staged changes. Older
# personal metadata remains in published history; credential rules still scan it.
[extend]
path = ".gitleaks.toml"
disabledRules = [
  "docs-personal-home-path",
  "docs-personal-email",
  "hardware-disk-identity",
  "docs-hardware-address",
]
