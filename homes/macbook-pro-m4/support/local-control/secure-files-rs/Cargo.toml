[package]
name = "local-control-secure-files"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
description = "Descriptor-bound filesystem safety primitives for local-control"
license = "MIT OR Apache-2.0"

[dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "=3.20.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
overflow-checks = true
panic = "abort"
