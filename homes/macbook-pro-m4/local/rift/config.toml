# MacBook Rift policy. OCR is injected from macos.ocrCapture.command by the module.

[settings]
default_disable = false
animate = false
focus_follows_mouse = false
mouse_follows_focus = false
mouse_hides_on_focus = false
hot_reload = true
run_on_start = []

[settings.layout]
mode = "traditional"
window_insertion_point = "next_to_selection"

[settings.layout.traditional]
equalize_nodes = true

[settings.layout.scrolling]
animate = false
column_width_ratio = 0.85
min_column_width_ratio = 0.5
max_column_width_ratio = 1.0
preserve_window_sizes = false
expand_single_column = true
alignment = "center"
focus_navigation_style = "niri"

[settings.layout.scrolling.gestures]
enabled = false

[settings.layout.stack]
stack_offset = 30.0

[settings.layout.gaps.outer]
top = 0
left = 0
bottom = 0
right = 0

[settings.layout.gaps.inner]
horizontal = 0
vertical = 0

[settings.ui.menu_bar]
enabled = true
show_empty = false
show_binding_mode = true
mode = "all"
display_style = "label"
active_label = "name"

[settings.ui.mission_control]
# Keep capture-related Rift features disabled; no Screen Recording setup.
enabled = false
window_previews = false
show_empty_workspaces = true

# Keep native trackpad gestures during the first migration. Enable four-finger
# Rift gestures only after checking macOS gesture conflicts.
[settings.gestures]
enabled = false

# Keep ordinary mouse/trackpad behavior during the initial migration.
[settings.drag_drop]
enabled = false

[virtual_workspaces]
mode = "global"
enabled = true
default_workspace_count = 20
default_workspace = 0
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
prevent_wrapping = false
reapply_app_rules_on_title_change = false
workspace_names = [
  "1",
  "2",
  "3",
  "4",
  "5",
  "6",
  "7",
  "8",
  "9",
  "B",
  "C",
  "D",
  "M",
  "N",
  "P",
  "T",
  "E",
  "A",
  "S",
  "Z",
]

# Numbered workspaces stay flexible scratch areas with the traditional default.
# No display placement rules. Spacious columns for content/editors/agents/terminal.
workspace_rules = [
  { workspace = "C", layout = "scrolling" },
  { workspace = "A", layout = "scrolling" },
  { workspace = "E", layout = "scrolling" },
  { workspace = "T", layout = "scrolling" },
]

# Rift selects ONE most-specific matching app rule; rules do not merge.
# Put single-condition dialog exceptions BEFORE single-condition app routes.
# Equal specificity uses earlier order, so native dialogs stay contextual. Do not add
# extra conditions to destination rules without updating these exceptions.
# v0.7.2 rejects repeated AX role/subrole strings across app rules.
# Never force management of system UI; normal manageability heuristics apply.
app_rules = [
  { ax_subrole = "AXDialog", manage = false },
  { ax_subrole = "AXSystemDialog", manage = false },
  { ax_subrole = "AXFloatingWindow", manage = false },
  { ax_role = "AXSheet", manage = false },

  # Gecko extension popouts belong to Zen, not the Bitwarden desktop app.
  # Match the extension wrapper and give it compact initial geometry.
  { app_id = "app.zen-browser.zen", title_regex = "^Extension: [(]Bitwarden Password Manager[)](?: - .*)?$", floating = true, size = { w = 480.0, h = 630.0 }, position = { x = 0.5, y = 0.5 } },

  # Contextual security and utility windows: float, without a destination.
  { app_id = "com.bitwarden.desktop", floating = true },
  { app_id = "com.apple.Passwords", floating = true },
  { app_id = "com.apple.systempreferences", floating = true },
  { app_id = "com.apple.ActivityMonitor", floating = true },
  { app_id = "com.apple.calculator", floating = true },
  { app_id = "com.apple.Dictionary", floating = true },
