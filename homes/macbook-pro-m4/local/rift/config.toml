  { app_id = "io.github.ianhollow.personalmonitor", floating = true },
  { app_id = "com.wireguard.macos", floating = true },

  { app_id = "app.zen-browser.zen", workspace = "C", focus = false },

  { app_id = "com.microsoft.VSCode", workspace = "E", focus = false },
  { app_id = "com.todesktop.230313mzl4w4u92", workspace = "E", focus = false },
