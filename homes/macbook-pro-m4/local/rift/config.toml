  # B is available for manual use. Secondary browsers, Finder, Preview,
  # QuickTime, Screen Sharing, capture
  # tools, and system agents have no destination rule. Keep them contextual.
]
[keys]
# Preserve workspace muscle memory. Commands take ZERO-based numeric indices.
"Alt + 1" = { switch_to_workspace = 0 }
"Alt + 2" = { switch_to_workspace = 1 }
"Alt + 3" = { switch_to_workspace = 2 }
"Alt + 4" = { switch_to_workspace = 3 }
"Alt + 5" = { switch_to_workspace = 4 }
"Alt + 6" = { switch_to_workspace = 5 }
"Alt + 7" = { switch_to_workspace = 6 }
"Alt + 8" = { switch_to_workspace = 7 }
"Alt + 9" = { switch_to_workspace = 8 }
"Alt + B" = { switch_to_workspace = 9 }
"Alt + C" = { switch_to_workspace = 10 }
"Alt + D" = { switch_to_workspace = 11 }
"Alt + M" = { switch_to_workspace = 12 }
"Alt + N" = { switch_to_workspace = 13 }
"Alt + P" = { switch_to_workspace = 14 }
"Alt + T" = { switch_to_workspace = 15 }
"Alt + E" = { switch_to_workspace = 16 }
"Alt + A" = { switch_to_workspace = 17 }
"Alt + S" = { switch_to_workspace = 18 }
"Alt + Z" = { switch_to_workspace = 19 }

"Alt + Shift + 1" = { move_window_to_workspace = { workspace = 0, follow = false } }
"Alt + Shift + 2" = { move_window_to_workspace = { workspace = 1, follow = false } }
"Alt + Shift + 3" = { move_window_to_workspace = { workspace = 2, follow = false } }
"Alt + Shift + 4" = { move_window_to_workspace = { workspace = 3, follow = false } }
"Alt + Shift + 5" = { move_window_to_workspace = { workspace = 4, follow = false } }
"Alt + Shift + 6" = { move_window_to_workspace = { workspace = 5, follow = false } }
"Alt + Shift + 7" = { move_window_to_workspace = { workspace = 6, follow = false } }
"Alt + Shift + 8" = { move_window_to_workspace = { workspace = 7, follow = false } }
"Alt + Shift + 9" = { move_window_to_workspace = { workspace = 8, follow = false } }
"Alt + Shift + B" = { move_window_to_workspace = { workspace = 9, follow = false } }
"Alt + Shift + C" = { move_window_to_workspace = { workspace = 10, follow = false } }
"Alt + Shift + D" = { move_window_to_workspace = { workspace = 11, follow = false } }
"Alt + Shift + M" = { move_window_to_workspace = { workspace = 12, follow = false } }
"Alt + Shift + N" = { move_window_to_workspace = { workspace = 13, follow = false } }
"Alt + Shift + P" = { move_window_to_workspace = { workspace = 14, follow = false } }
"Alt + Shift + T" = { move_window_to_workspace = { workspace = 15, follow = false } }
"Alt + Shift + E" = { move_window_to_workspace = { workspace = 16, follow = false } }
"Alt + Shift + A" = { move_window_to_workspace = { workspace = 17, follow = false } }
"Alt + Shift + S" = { move_window_to_workspace = { workspace = 18, follow = false } }
"Alt + Shift + Z" = { move_window_to_workspace = { workspace = 19, follow = false } }

# N gains the missing, symmetric Option+Shift+N move shortcut.
"Alt + Tab" = "switch_to_last_workspace"
"Alt + H" = { move_focus = "left" }
"Alt + J" = { move_focus = "down" }
"Alt + K" = { move_focus = "up" }
"Alt + L" = { move_focus = "right" }
"Alt + Shift + H" = { move_node = "left" }
"Alt + Shift + J" = { move_node = "down" }
"Alt + Shift + K" = { move_node = "up" }
"Alt + Shift + L" = { move_node = "right" }
"Alt + Minus" = { resize_window_shrink = "smart" }
"Alt + Equal" = { resize_window_grow = "smart" }
"Alt + Shift + F" = "toggle_fullscreen"
"Alt + Slash" = "toggle_orientation"
"Alt + Comma" = "toggle_stack"
"Alt + Shift + R" = "reload_config"
"Alt + Shift + Semicolon" = { binding_mode = "service" }

# Easy additions: float, temporary tiling suspension, and terminal.
# No Overview binding: capture-related Rift features stay disabled.
"Alt + Shift + Space" = "toggle_window_floating"
"Alt + Ctrl + Z" = "toggle_space_activated"
"Alt + Enter" = { exec = ["/usr/bin/open", "-b", "com.mitchellh.ghostty"] }

# Modes replace the main keymap. Escape always returns to ordinary shortcuts.
[binding_modes.service]
"Escape" = [{ binding_mode = "default" }, "reload_config"]
"F" = ["toggle_window_floating", { binding_mode = "default" }]
"R" = ["balance", { binding_mode = "default" }]
"S" = [
  { set_workspace_layout = { mode = "scrolling" } },
  { binding_mode = "default" },
]
"T" = [
  { set_workspace_layout = { mode = "traditional" } },
  { binding_mode = "default" },
]
"C" = ["center_selection", { binding_mode = "default" }]
"Alt + Shift + H" = [{ join_window = "left" }, { binding_mode = "default" }]
"Alt + Shift + J" = [{ join_window = "down" }, { binding_mode = "default" }]
"Alt + Shift + K" = [{ join_window = "up" }, { binding_mode = "default" }]
"Alt + Shift + L" = [{ join_window = "right" }, { binding_mode = "default" }]
