[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["tests", "tests/fonts"]
addopts = [
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
  "-p",
  "pytest_timeout",
  "-ra",
  "-m",
  "not nix_integration and not nix_daemon",
]
timeout = 120
xfail_strict = true
markers = [
  "nix_integration: requires generated artifacts supplied by its Nix check",
  "nix_daemon: exercises Git/Nix orchestration outside the build sandbox",
]

[tool.ruff]
target-version = "py314"
# Submodules own their Ruff configurations and checks.
extend-exclude = ["nix-config-framework", "nix-homelab", "nix-seal", "pkgs"]
fix = false
preview = true

[tool.ruff.lint]
preview = true
future-annotations = true
select = ["ALL"]
ignore = [
  # Ruff Formatter Ignores
  "tab-indentation",                           # tab-indentation
  "indentation-with-invalid-multiple",         # indentation-with-invalid-multiple
  "indentation-with-invalid-multiple-comment", # indentation-with-invalid-multiple-comment
  "over-indented",                             # over-indented
  "docstring-tab-indentation",                 # docstring-tab-indentation
  "triple-single-quotes",                      # triple-single-quotes
  "bad-quotes-inline-string",                  # bad-quotes-inline-string
  "bad-quotes-multiline-string",               # bad-quotes-multiline-string
  "bad-quotes-docstring",                      # bad-quotes-docstring
  "avoidable-escaped-quote",                   # avoidable-escaped-quote
  "missing-trailing-comma",                    # missing-trailing-comma
  "prohibited-trailing-comma",                 # prohibited-trailing-comma
  "multi-line-implicit-string-concatenation",  # multi-line-implicit-string-concatenation, ignore if used without ISC001 and flake8-implicit-str-concat.allow-multiline = false
  "line-too-long",                             # line-too-long

  # Copyright
  "CPY",

  # Boolean in function
  "FBT",

  # No need for init files
  "implicit-namespace-package",

  # Documentation
  "incorrect-blank-line-before-class", # 1 blank line before class docstring
  "multi-line-summary-second-line",    # multi-line-summary-first-line
]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-builtins]
strict-checking = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
preview = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.per-file-ignores]
"tests/homelab/music/test_listenbrainz_identity.py" = [
  # Disposable provider tokens are explicit fixtures, never real credentials.
  "hardcoded-password-string",
]
"hosts/nixos/desktop/local/homelab/scripts/bootstrap_books.py" = [
  # The object/list validators check JSON shapes; API fields remain heterogeneous.
  "any-type",
]
"tests/homelab/test_books_bootstrap.py" = [
  # The local HTTP fixture stores several API record shapes in one state mapping.
  "any-type",
]
"tests/homelab/music/test_bootstrap_aurral.py" = [
  # Mocks preserve the API signatures and return heterogeneous JSON fixture data.
  "any-type",
  "unused-function-argument",
  "unused-lambda-argument",
  "magic-value-comparison",
  "hardcoded-password-string",
  "raise-vanilla-args",
  "raw-string-in-exception",
  "f-string-in-exception",
  "complex-structure",
  "too-many-return-statements",
]
"tests/homelab/music/test_*users.py" = [
  # Native filesystem fixtures invoke only the repository entrypoint.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
]
"tests/homelab/music/test_discovery_directories.py" = [
  # Native filesystem fixtures invoke only the repository entrypoint.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
]
"tests/virtualisation/test_windows_iso_fetch.py" = [
  # Pinned command fixtures exercise the download refusal paths.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
]
"overlays/temporary/tests/prowlarr_torrentdownload.py" = [
  # Offline indexer fixtures compare literal apostrophe variants and known filters.
  "assert",
  "ambiguous-unicode-character-string",
  "print",
]
"hosts/nixos/desktop/local/homelab/credentials/miniflux_*.py" = [
  # Operator commands use argument lists, sanitized diagnostics and dynamic API JSON.
  "any-type",
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "start-process-with-partial-path",
  "suspicious-url-open-usage",
  "print",
  "raise-vanilla-args",
  "raw-string-in-exception",
  "f-string-in-exception",
  "too-many-arguments",
  "too-many-positional-arguments",
  "docstring-missing-exception",
]
"hosts/nixos/desktop/local/homelab/music/scripts/bootstrap_aurral.py" = [
  # Fixed configured service endpoints return dynamic JSON; diagnostics omit credentials.
  # One ordered bootstrap groups the integration updates and fails for systemd retry.
  "any-type",
  "suspicious-url-open-usage",
  "print",
  "raise-vanilla-args",
  "raw-string-in-exception",
  "f-string-in-exception",
  "docstring-missing-exception",
  "complex-structure",
  "too-many-branches",
  "too-many-statements",
  "too-many-locals",
  "magic-value-comparison",
]

"templates/*/tests/scripts/*.py" = [
  # Template integration checks execute only their generated launchd command.
  "assert",
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
]
"tests/nix/scripts/check_*.py" = [
  # Names match Nix derivation attributes; inputs are generated fixture outputs.
  "uncapitalized-environment-variables",
  "magic-value-comparison",
  "suspicious-xml-etree-import",
  "suspicious-xml-element-tree-usage",
]
"tests/nix/scripts/generated_configs_check.py" = [
  # The environment attribute belongs to the Nix fixture API.
  "uncapitalized-environment-variables",
]
"tests/public-guide/graphical_vm_test.py" = [
  # Sway's JSON tree is heterogeneous; assert the two-window guide behavior.
  "any-type",
  "magic-value-comparison",
]

"tests/hyprland/scripts/*_test.py" = [
  # These temporary paths exist only inside a disposable VM.
  "hardcoded-temp-file",
]

"hosts/nixos/desktop/local/homelab/music/scripts/*.py" = [
  # Dynamic JSON responses from fixed local APIs; diagnostics never include credentials.
  "any-type",
  "suspicious-url-open-usage",
  "print",
  "blind-except",
  "raise-within-try",
  "magic-value-comparison",
]

"homes/desktop/local/cloud/google_drive.py" = [
  # Operator CLI invokes immutable commands as argument lists and reports only
  # sanitized failures. Public refusal messages carry no credential values.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "print",
  "raise-vanilla-args",
  "raw-string-in-exception",
  "too-many-statements-in-try-clause",
]
"tests/storage/test_google_drive.py" = [
  # Standard-library test cases also run with pytest's repository runner.
  "pytest-unittest-assertion",
]
"modules/home/dev/scripts/dev_worktree.py" = [
  # Operator CLI executes explicit argument lists and reports actionable refusals.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "print",
  "raise-vanilla-args",
  "raw-string-in-exception",
]
"tests/worktrees/*.py" = [
  # Real Git and Python subprocesses operate only on disposable fixture clones.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "start-process-with-partial-path",
]
"hosts/nixos/desktop/local/storage/scripts/prepare_desktop_installer.py" = [
  # Operator CLI invokes Git without a shell and reports only public status.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "start-process-with-partial-path",
  "print",
  "raise-vanilla-args",
  "raw-string-in-exception",
]
"hosts/nixos/desktop/local/homelab/actual/scripts/actual_*.py" = [
  # Fixed deployment endpoints, dynamic Keycloak JSON and sanitized CLI failures.
  # Exceptions never print credential-bearing URLs or response content.
  "suspicious-url-open-usage",
  "print",
  "blind-except",
  "raise-vanilla-args",
  "raw-string-in-exception",
  "any-type",
]
"tests/homelab/test_actual_vault.py" = [
  # Execute only the repository script and disposable fixture commands.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "start-process-with-partial-path",
]
"hosts/nixos/desktop/local/homelab/credentials/identity_to_bitwarden.py" = [
  # Operator CLI reports only status; its credential transport suppresses output.
  # Realm construction groups the account and OIDC credential inputs.
  "print",
  "too-many-arguments",
  "too-many-positional-arguments",
  "raise-vanilla-args",
  "raw-string-in-exception",
]

"fuzz/*.py" = [
  # Fuzzer properties deliberately use assertions to signal a crash.
  "assert",
]
"scripts/workstation_evidence.py" = [
  # Explicit operator CLI: immutable wrappers supply Git; Nix uses the host client.
  # Commands execute as argument lists, and reports/logs remain private locally.
  "print",
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "start-process-with-partial-path",
  "raise-vanilla-args",
  "raw-string-in-exception",
  "f-string-in-exception",
]
"tests/evidence/*.py" = [
  # Disposable command fixtures verify real exit statuses, timeouts and Git state.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "start-process-with-partial-path",
  "magic-value-comparison",
]
"tests/systemd/{check_workstation_processes,check_workstation_oom,workstation_task_child}.py" = [
  # Native contract scenarios invoke fixed local commands and fixture files.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "magic-value-comparison",
  "any-type",
  "too-many-statements",
  "too-many-locals",
  "raise-vanilla-args",
]
"hosts/nixos/desktop/local/homelab/credentials/identity_reveal_worker.py" = [
  # The SSH worker invokes nix-seal from the administrator's configured PATH.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "start-process-with-partial-path",
]
"tests/systemd/check_chatgpt_oom.py" = [
  # Native OOM regression uses resolved command lists and temporary output files.
  "subprocess-without-shell-equals-true",
]
"tests/**/*.py" = [
  # Pytest also runs the retained TestCase suites. Keep useful assertions while
  # using plain pytest functions for new tests and substantial rewrites.
  "assert",
  "pytest-unittest-assertion",
  "pytest-unittest-raises-assertion",
]
"modules/home/dev/scripts/git_privacy_hook.py" = [
  # Invoke pinned Git/gh and executable repository hooks directly, without a shell.
  "subprocess-without-shell-equals-true",
]
"tests/git_privacy/test_hooks.py" = [
  # Real Git subprocesses run only in disposable fixtures with pytest.
  "pytest-unittest-assertion",
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "start-process-with-partial-path",
]
"tests/storage/*.py" = [
  # Disposable fixtures assert recovery outcomes and run real local Restic.
  "assert",
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "hardcoded-password-string",
]
"hosts/nixos/desktop/local/storage/*.py" = [
  # These operator CLIs intentionally print status and invoke fixed utilities
  # without a shell. Their wrappers provide an immutable executable PATH.
  "print",
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  # Preflight exception text is the CLI's diagnostic, not a reusable API.
  "raise-vanilla-args",
  "raw-string-in-exception",
]
"tests/nix/check_python_helpers.py" = [
  # Sandbox fixture assertions use literal protocol and configuration values.
  "assert",
  "magic-value-comparison",
]
"tests/nix/check_template_configs.py" = [
  # This sandbox check runs with ordinary Python and compares generated output.
  "assert",
]
"tests/codex/test_appearance_config.py" = [
  # Exercise the generated updater on temporary configs with pytest.
  "pytest-unittest-assertion",
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
]
"tests/ci/test_*.py" = [
  # Exercise real Git and Nix commands in disposable repositories using pytest.
  "pytest-unittest-assertion",
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "start-process-with-partial-path",
]
".github/scripts/run-flake-checks.py" = [
  # This CI entrypoint intentionally orchestrates fixed Git and Nix executables
  # and emits GitHub workflow-group commands while continuing independent checks.
  "complex-structure",
  "print",
  "raise-vanilla-args",
  "raw-string-in-exception",
  "suspicious-subprocess-import",
  "start-process-with-partial-path",
  "subprocess-without-shell-equals-true",
  "too-many-arguments",
  "too-many-branches",
]
".github/scripts/ci_partitioning.py" = [
  # Validation failures include the offending check name to make a bad manual
  # weight file or matrix immediately diagnosable in the CI log.
  "f-string-in-exception",
  "raise-vanilla-args",
  "raw-string-in-exception",
]
# Migration and rollback tests use disposable fixtures.
"tests/secrets/test_secret_templates.py" = [
  "pytest-unittest-assertion",
  "pytest-unittest-raises-assertion",
]
# Runner regression tests isolate children from the live compositor.
"tests/hyprland/test_upstream_local_runner.py" = ["pytest-unittest-assertion"]

"tests/secrets/test_public_templates.py" = [
  # Exercise the installed CLI with disposable keys using pytest.
  "pytest-unittest-assertion",
  "pytest-unittest-raises-assertion",
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "start-process-with-partial-path",
]

"modules/nixos/virtualisation/scripts/windows_vm_render_seed.py" = [
  "hardcoded-password-string",         # The flagged value is a public placeholder token, not a credential.
  "suspicious-xml-element-tree-usage", # The immutable template is trusted and all variable text is escaped first.
  "suspicious-xml-etree-import",       # ElementTree only proves that the locally generated answer file is well-formed.
]
"tests/browsers/test_gecko_install_registry.py" = [
  # The check exercises the command in the Nix sandbox.
  "pytest-unittest-assertion",
]
"tests/virtualisation/test_windows_seed_renderer.py" = [
  "hardcoded-password-string",         # Test-only credential fixtures contain no operational secret.
  "pytest-unittest-assertion",         # Pytest supports the retained TestCase assertions.
  "pytest-unittest-raises-assertion",  # Pytest supports TestCase exception assertions.
  "suspicious-xml-element-tree-usage", # The parsed document was generated from a fixed local test template.
  "suspicious-xml-etree-import",       # ElementTree is sufficient for trusted test output without entity declarations.
]
"tests/virtualisation/test_libvirt_workstation_setup.py" = [
  # Parse fixture XML to test its meaning rather than serializer whitespace.
  "suspicious-xml-etree-import",
  "suspicious-xml-element-tree-usage",
  "pytest-unittest-assertion",            # Pytest supports the retained TestCase assertions.
  "subprocess-without-shell-equals-true", # The test invokes a generated fixture path without a shell.
  "suspicious-subprocess-import",         # The subprocess is the script under test.
]
"scripts/update_packages.py" = [
  "suspicious-subprocess-import",         # Uses subprocess intentionally in a local CLI orchestrator.
  "subprocess-without-shell-equals-true", # Command args are constrained to local script paths and CLI flags.
]

"modules/nixos/virtualisation/scripts/libvirt_xml.py" = [
  # UTF-8-only input is size-bounded; DTDs and entities are rejected before parsing.
  "suspicious-xml-etree-import",
  "suspicious-xml-element-tree-usage",
  # This small CLI reports explicit policy errors directly to its operator.
  "raise-vanilla-args",
  "raw-string-in-exception",
  "f-string-in-exception",
]
"tests/virtualisation/test_libvirt_xml.py" = [
  # Invoke only this repository's parser with fixture input and no shell.
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
]

[tool.ty.analysis]
# uharfbuzz re-exports a Cython extension without .pyi files. Keep only this
# native module opaque; font shaping is exercised by the native font checks.
replace-imports-with-any = ["uharfbuzz"]
# lxml.etree is also a compiled extension without shipped Python type stubs.
# libvirt and pyudev are installed only on Linux; Darwin checks the shared tree.
# Atheris is installed only in the fuzz job.
allowed-unresolved-imports = [
  "test_driver.*",
  "atheris",
  "libvirt",
  "lxml.etree",
  "pyudev",
]

[tool.ty.environment]
extra-paths = ["tests", "tests/fonts", "site"]
# Pin the target independently of a developer's active virtual environment so
# editor, pre-commit, and pure Nix checks analyse the same Python language and
# standard-library surface.
python-version = "3.14"
python-platform = "all"

[tool.ty.src]
include = ["**/*.py", "**/*.pyi"]
exclude = [
  ".git",
  ".direnv",
  ".ruff_cache",
  ".mypy_cache",
  ".pytest_cache",
  "**/__pycache__",
  "dist",
  "build",
  "result",
  # Submodules own their static analysis. Root checks validate their exported
  # Nix interfaces without recursively linting each repository a second time.
  "nix-config-framework",
  "nix-homelab",
  "nix-seal",
  "pkgs",
]

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"
