[tool.ruff]
exclude = ["nix-seal"]
fix = true
preview = true

[tool.ruff.lint]
preview = true
future-annotations = true
select = ["ALL"]
ignore = [
  # Ruff Formatter Ignores
  "tab-indentation",                           # tab-indentation
  "indentation-with-invalid-multiple",         # indentation-with-invalid-multiple
  "indentation-with-invalid-multiple-comment", # indentation-with-invalid-multiple-comment
  "over-indented",                             # over-indented
  "docstring-tab-indentation",                 # docstring-tab-indentation
  "triple-single-quotes",                      # triple-single-quotes
  "bad-quotes-inline-string",                  # bad-quotes-inline-string
  "bad-quotes-multiline-string",               # bad-quotes-multiline-string
  "bad-quotes-docstring",                      # bad-quotes-docstring
  "avoidable-escaped-quote",                   # avoidable-escaped-quote
  "missing-trailing-comma",                    # missing-trailing-comma
  "prohibited-trailing-comma",                 # prohibited-trailing-comma
  "multi-line-implicit-string-concatenation",  # multi-line-implicit-string-concatenation, ignore if used without ISC001 and flake8-implicit-str-concat.allow-multiline = false
  "line-too-long",                             # line-too-long

  # Copyright
  "CPY",

  # Boolean in function
  "FBT",

  # No need for init files
  "implicit-namespace-package",

  # Documentation
  "incorrect-blank-line-before-class", # 1 blank line before class docstring
  "multi-line-summary-second-line",    # multi-line-summary-first-line
]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-builtins]
strict-checking = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
preview = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.per-file-ignores]
"pkgs/pkgs/by-name/op/openai-codex-desktop/test_update.py" = [
  "private-member-access",            # Tests exercise the updater's internal parsers without network requests.
  "pytest-unittest-assertion",        # Package checks use the standard-library unittest runner in the Nix sandbox.
  "pytest-unittest-raises-assertion", # Keep the updater checks free of a pytest runtime dependency.
]
"pkgs/pkgs/by-name/wo/wootility/update.py" = [
  "suspicious-subprocess-import",         # Invokes the discovered Nix executable to prefetch a validated release URL.
  "subprocess-without-shell-equals-true", # Uses fixed nix arguments and an HTTPS URL with no shell.
  "suspicious-url-open-usage",            # Validates Wooting discovery URLs and the version-bound download endpoint.
]
"modules/nixos/virtualisation/scripts/windows-vm-render-seed.py" = [
  "hardcoded-password-string",         # The flagged value is a public placeholder token, not a credential.
  "suspicious-xml-element-tree-usage", # The immutable template is trusted and all variable text is escaped first.
  "suspicious-xml-etree-import",       # ElementTree only proves that the locally generated answer file is well-formed.
]
"tests/browsers/test_gecko_install_registry.py" = [
  # The check uses the standard-library unittest runner in the Nix sandbox.
  "pytest-unittest-assertion",
]
"tests/virtualisation/test_windows_seed_renderer.py" = [
  "hardcoded-password-string",         # Test-only credential fixtures contain no operational secret.
  "pytest-unittest-assertion",         # The Nix sandbox intentionally uses the standard-library unittest runner.
  "pytest-unittest-raises-assertion",  # Keep the focused check free of a pytest runtime dependency.
  "suspicious-xml-element-tree-usage", # The parsed document was generated from a fixed local test template.
  "suspicious-xml-etree-import",       # ElementTree is sufficient for trusted test output without entity declarations.
]
"tests/virtualisation/test_libvirt_workstation_setup.py" = [
  "pytest-unittest-assertion",            # The Nix sandbox intentionally uses the standard-library unittest runner.
  "subprocess-without-shell-equals-true", # The test invokes a generated fixture path without a shell.
  "suspicious-subprocess-import",         # The subprocess is the script under test.
]
"pkgs/pkgs/by-name/bi/bitwarden-desktop/update.py" = [
  "complex-structure",                    # Release parsing validates several independent fields in one linear pass.
  "suspicious-subprocess-import",         # Uses subprocess intentionally to call the discovered nix executable.
  "subprocess-without-shell-equals-true", # Command args are fixed nix prefetch arguments and a path-validated HTTPS asset URL.
  "suspicious-url-open-usage",            # URL opening is limited to GitHub's fixed HTTPS release API.
]
"homes/macbook-pro-m4/local/dev_vm_host_test.py" = [
  # This Nix check deliberately uses only the Python standard library so it
  # can validate the runtime resolver without adding pytest to the closure.
  "pytest-unittest-assertion",
  "pytest-unittest-raises-assertion",
]
"pkgs/pkgs/by-name/cl/claude-desktop/update.py" = [
  "suspicious-subprocess-import",         # Uses subprocess intentionally to call nix store prefetch-file.
  "subprocess-without-shell-equals-true", # Command args are constrained to a fixed nix invocation and feed URL.
  "suspicious-url-open-usage",            # URL opening is limited to validated HTTPS release feed URLs.
]
"pkgs/pkgs/by-name/li/libreoffice/update.py" = [
  "suspicious-subprocess-import",         # Uses subprocess intentionally to call an absolute nix executable selected from PATH.
  "subprocess-without-shell-equals-true", # Command args are fixed nix prefetch arguments and a host-validated HTTPS download URL.
  "suspicious-url-open-usage",            # URL opening is limited to the Document Foundation's validated HTTPS release URLs.
]
"pkgs/pkgs/by-name/li/linearmouse/update.py" = [
  "suspicious-subprocess-import",         # Uses subprocess intentionally to call the discovered nix executable.
  "subprocess-without-shell-equals-true", # Command args are fixed nix prefetch arguments and a GitHub path-validated HTTPS asset URL.
  "suspicious-url-open-usage",            # URL opening is limited to GitHub's validated HTTPS release API and asset URLs.
]
"pkgs/pkgs/by-name/mi/microsoft-teams/update.py" = [
  "suspicious-subprocess-import",         # Uses subprocess intentionally to call nix store prefetch-file.
  "subprocess-without-shell-equals-true", # Command args are constrained to a fixed nix invocation and validated CDN URL.
  "suspicious-url-open-usage",            # URL opening is limited to the validated HTTPS Teams production config.
]
"pkgs/pkgs/by-name/op/openai-codex-desktop/update.py" = [
  "suspicious-subprocess-import",         # Uses subprocess intentionally to call nix store prefetch-file.
  "subprocess-without-shell-equals-true", # Command args are constrained to a fixed nix invocation and appcast URL.
  "suspicious-url-open-usage",            # URL opening is limited to validated HTTPS appcast URLs.
  "suspicious-xml-etree-import",          # xml.etree is sufficient for a trusted upstream Sparkle appcast.
  "suspicious-xml-element-tree-usage",    # The appcast is a fixed upstream document parsed without entity expansion.
]
"pkgs/pkgs/by-name/re/remindctl/update.py" = [
  "suspicious-subprocess-import",         # Uses subprocess intentionally to call nix and validate the release binary.
  "subprocess-without-shell-equals-true", # Command args are constrained to fixed nix and validated binary invocations.
  "suspicious-url-open-usage",            # URL opening is limited to validated HTTPS GitHub release URLs.
]
"pkgs/pkgs/by-name/sp/spotify-spotx/update.py" = [
  "suspicious-subprocess-import",         # Uses subprocess intentionally to call nix and git for upstream discovery.
  "subprocess-without-shell-equals-true", # Command args are constrained to fixed nix/git invocations and validated refs.
  "suspicious-url-open-usage",            # URL opening is limited to validated HTTPS Spotify and GitHub release URLs.
]
"pkgs/pkgs/by-name/st/steam/update.py" = [
  "suspicious-subprocess-import",         # Uses subprocess intentionally to call nix/curl/unzip.
  "subprocess-without-shell-equals-true", # Command args are constrained to fixed local binaries and a validated URL.
  "suspicious-url-open-usage",            # URL fetching is limited to validated HTTPS Steam endpoints.
]
"pkgs/pkgs/by-name/t3/t3-code/update.py" = [
  "suspicious-subprocess-import",         # Uses subprocess intentionally to call the discovered nix executable.
  "subprocess-without-shell-equals-true", # Command args are fixed nix prefetch arguments and a release path-validated HTTPS asset URL.
  "suspicious-url-open-usage",            # URL opening is limited to GitHub's validated HTTPS release API and asset URLs.
]
"pkgs/pkgs/by-name/tt/ttf-ms-win11-auto/update.py" = [
  "suspicious-subprocess-import",         # Uses subprocess intentionally to call nix store prefetch-file.
  "subprocess-without-shell-equals-true", # Command args are constrained to a fixed nix invocation and URL.
  "suspicious-url-open-usage",            # URL opening is limited to HTTPS and user-overridable by design.
]
"pkgs/pkgs/by-name/vo/vorssaint/update.py" = [
  "suspicious-subprocess-import",         # Uses subprocess intentionally to call the discovered nix executable.
  "subprocess-without-shell-equals-true", # Command args are fixed nix prefetch arguments and a revision-bound GitHub archive URL.
  "suspicious-url-open-usage",            # URL opening is limited to fixed GitHub API endpoints and revision-bound HTTPS URLs.
]
"pkgs/scripts/agent-skills-updater.py" = [
  "invalid-module-name",                  # The hyphenated filename is executed as a script, not imported as a Python module.
  "suspicious-subprocess-import",         # Uses subprocess intentionally to call nix store prefetch-file.
  "subprocess-without-shell-equals-true", # Command args are constrained to a fixed nix invocation and GitHub archive URL.
  "start-process-with-partial-path",      # nix is provided by the user environment for this local updater.
  "suspicious-url-open-usage",            # URL opening is limited to fixed HTTPS GitHub API endpoints.
  "print",                                # This command-line updater reports its status and diffs on stdout.
]
"pkgs/scripts/update-packages.py" = [
  "invalid-module-name",                  # The hyphenated filename is executed as a script, not imported as a Python module.
  "suspicious-subprocess-import",         # Runs only a discovered local package updater through sys.executable.
  "subprocess-without-shell-equals-true", # Command args are an interpreter, an in-repository updater path, and user-supplied child args without a shell.
]
"scripts/update-packages.py" = [
  "suspicious-subprocess-import",         # Uses subprocess intentionally in a local CLI orchestrator.
  "subprocess-without-shell-equals-true", # Command args are constrained to local script paths and CLI flags.
]

[tool.ty.environment]
# Pin the target independently of a developer's active virtual environment so
# editor, pre-commit, and pure Nix checks analyse the same Python language and
# standard-library surface.
python-version = "3.14"
python-platform = "all"

[tool.ty.src]
include = ["**/*.py", "**/*.pyi"]
exclude = [
  ".git",
  ".direnv",
  ".ruff_cache",
  ".mypy_cache",
  ".pytest_cache",
  "**/__pycache__",
  "dist",
  "build",
  "nix-seal",
  "result",
]

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"
