name: Request review for human pull requests
on: # zizmor: ignore[dangerous-triggers] This workflow does not check out or run pull request code. It only requests a reviewer from event metadata.
  pull_request_target:
    types: [opened, reopened, ready_for_review]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  request-review:
    name: request-review
    permissions:
      pull-requests: write # Update pull request metadata.
    uses: nix-forge/ci/.github/workflows/request-review.yml@bb1b39a9082f72dc6c7ce596103ce7a5e4d29b01 # v2.8.0
    with:
      reviewer: IanHollow
