name: Request review for human pull requests
on: # zizmor: ignore[dangerous-triggers] This workflow does not check out or run pull request code. It only requests a reviewer from event metadata.
  pull_request_target:
    types: [opened, reopened, ready_for_review]
permissions: {}
jobs:
  request-review:
    if: >-
      github.event.pull_request.user.type != 'Bot' && github.event.pull_request.user.login != 'IanHollow' && github.event.pull_request.draft == false && github.repository == 'nix-forge/nix-conf'
    permissions:
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --add-reviewer IanHollow
