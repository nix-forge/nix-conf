name: Request review for human pull requests
on: # zizmor: ignore[dangerous-triggers] This workflow does not check out or run pull request code. It only requests a reviewer from event metadata.
  pull_request_target:
    types: [opened, reopened, ready_for_review]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  request-review:
    name: request-review
    permissions:
      pull-requests: write # Update pull request metadata.
    uses: nix-forge/ci/.github/workflows/request-review.yml@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
    with:
      reviewer: IanHollow
