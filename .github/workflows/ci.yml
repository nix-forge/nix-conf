name: CI Tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for native comparison workflows.
        required: false
        type: string
  merge_group:
    types: [checks_requested]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  discover:
    name: Discover CI inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lockfiles: ${{ steps.inventory.outputs.lockfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inventory
        uses: nix-forge/ci/actions/discover-lockfiles@b5ec655589b52df24c9b38d20a6b4bf364ec35cc # v2.5.4
  legacy-secret-manager-symbols:
    name: Reject removed secret-manager runtime references
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          if git grep -nEi 'secret[c]tl|secret[I]ndex|config[.]age[.]secrets|inputs[.]agenix' -- . ':(exclude).gitleaksignore'; then
            echo 'removed secret-manager symbols or agenix runtime references found' >&2
            exit 1
          fi
  lock-health:
    name: Flake lock health
    needs: [flake-lock]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every discovered lockfile to pass
        env:
          LOCK_RESULT: ${{ needs.flake-lock.result }}
        run: test "$LOCK_RESULT" = success
  flake-lock:
    needs: [discover]
    name: Flake lock health (${{ matrix.lockfile }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lockfile: ${{ fromJSON(needs.discover.outputs.lockfiles) }}
    uses: nix-forge/ci/.github/workflows/flake-lock.yml@b5ec655589b52df24c9b38d20a6b4bf364ec35cc # v2.5.4
    with:
      lockfile: ${{ matrix.lockfile }}
  lint:
    name: Repository hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@b5ec655589b52df24c9b38d20a6b4bf364ec35cc # v2.5.4
        with:
          cache: 'false'
          cache-scope: ci-lint
      - name: Check shared workflow contracts
        uses: nix-forge/ci/actions/validate-workflows@b5ec655589b52df24c9b38d20a6b4bf364ec35cc # v2.5.4
      - name: Run repository hooks and publication checks
        uses: nix-forge/ci/actions/repository-checks@b5ec655589b52df24c9b38d20a6b4bf364ec35cc # v2.5.4
        with:
          dev-shell: ci
          publication-script: .github/scripts/scan-publication.sh
      - name: Build portable lint checks
        uses: nix-forge/ci/actions/flake-checks@b5ec655589b52df24c9b38d20a6b4bf364ec35cc # v2.5.4
        with:
          system: x86_64-linux
          checks-output: lintChecks
      - name: Test native package selection
        run: nix develop .#tests --command python3 -m pytest -m nix_daemon tests/ci
      - name: Run submodule hooks
        run: |
          git submodule foreach --recursive '
            nix develop --command bash -c "prek run --all-files && gitleaks git --redact --no-banner"
          '
  flake:
    name: Flake checks (${{ matrix.label }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.runner }}
    # Host-bound assurance checks run explicitly on the desktop instead.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
            label: x86_64-linux 1/3
            partition-count: 3
            partition-index: 0
          - system: x86_64-linux
            runner: ubuntu-24.04
            label: x86_64-linux 2/3
            partition-count: 3
            partition-index: 1
          - system: x86_64-linux
            runner: ubuntu-24.04
            label: x86_64-linux 3/3
            partition-count: 3
            partition-index: 2
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            label: aarch64-linux
            partition-count: 1
            partition-index: 0
          - system: aarch64-darwin
            runner: macos-26
            label: aarch64-darwin
            partition-count: 1
            partition-index: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@b5ec655589b52df24c9b38d20a6b4bf364ec35cc # v2.5.4
        with:
          cache: 'false'
          cache-scope: ci-flake
      - name: Build every declared native CI check
        uses: nix-forge/ci/actions/flake-checks@b5ec655589b52df24c9b38d20a6b4bf364ec35cc # v2.5.4
        with:
          system: ${{ matrix.system }}
          checks-output: ciChecks
          partition-count: ${{ matrix.partition-count }}
          partition-index: ${{ matrix.partition-index }}
      - name: Check extracted public templates and module consumers
        if: matrix.partition-index == 0
        env:
          GUIDE_SYSTEM: ${{ matrix.system }}
        run: bash tests/public-guide/check-consumers.sh "$PWD" "$GUIDE_SYSTEM"
      - name: Check native Core Text selection and shaping
        if: matrix.system == 'aarch64-darwin'
        shell: bash
        run: |
          selection=$(nix build --no-link --print-out-paths .#checks.aarch64-darwin.font-selection)
          xcrun swift tests/fonts/check_coretext.swift "$selection/selection.json"
  tests:
    name: Repository tests
    needs: [flake]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the Nix test matrix to pass
        env:
          FLAKE_RESULT: ${{ needs.flake.result }}
        run: test "$FLAKE_RESULT" = success
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/',
      github.event.repository.default_branch))
    needs: [lock-health, discover, legacy-secret-manager-symbols, flake-lock, lint, flake, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch the trusted queue reconciler after validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@b5ec655589b52df24c9b38d20a6b4bf364ec35cc # v2.5.4
