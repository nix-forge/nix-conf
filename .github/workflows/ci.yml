name: CI Tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for native package comparison.
        required: false
        type: string
      build_native_packages:
        description: Build changed native packages in the explicit package audit.
        required: false
        default: false
        type: boolean
      use_nix_cache:
        description: Enable the bounded GitHub Nix store cache for a manual benchmark.
        required: false
        default: false
        type: boolean
  merge_group:
    types: [checks_requested]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
env:
  # Reviewed runner policy; flake-supplied settings remain untrusted.
  NIX_CONFIG: >
    extra-substituters = https://nix-community.cachix.org https://hyprland.cachix.org https://cache.nixos-cuda.org
    https://noctalia.cachix.org https://nixos-raspberrypi.cachix.org

    extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
    hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=
    noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=

jobs:
  discover:
    name: Discover CI inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lockfiles: ${{ steps.inventory.outputs.lockfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inventory
        uses: nix-forge/ci/actions/discover-lockfiles@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
  legacy-secret-manager-symbols:
    name: Reject removed secret-manager runtime references
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          if git grep -nEi 'secret[c]tl|secret[I]ndex|config[.]age[.]secrets|inputs[.]agenix' -- . ':(exclude).gitleaksignore'; then
            echo 'removed secret-manager symbols or agenix runtime references found' >&2
            exit 1
          fi
  lock-health:
    name: Flake lock health
    needs: [flake-lock]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every discovered lockfile to pass
        env:
          LOCK_RESULT: ${{ needs.flake-lock.result }}
        run: test "$LOCK_RESULT" = success
  flake-lock:
    needs: [discover]
    name: Flake lock health (${{ matrix.lockfile }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lockfile: ${{ fromJSON(needs.discover.outputs.lockfiles) }}
    uses: nix-forge/ci/.github/workflows/flake-lock.yml@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
    with:
      lockfile: ${{ matrix.lockfile }}
  static:
    name: Rust static and compile checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: nix-forge/ci/actions/setup-nix@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
        with:
          cache: 'true'
          cache-scope: ci-rust
          cache-write-mode: read-only
          cache-restore-compatible: 'true'
      - name: Check Rust workspaces and source policy
        run: nix develop .#ciRust --command rust-workspaces check
      - name: Check current Rust dependency advisories
        run: nix develop .#ciRust --command rust-workspaces audit
  lint:
    needs: [static]
    name: Repository hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
        with:
          cache: 'true'
          cache-scope: ci-lint
          cache-write-mode: read-only
          cache-restore-compatible: 'true'
      - name: Check shared workflow contracts
        uses: nix-forge/ci/actions/validate-workflows@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
      - name: Run repository hooks and publication checks
        uses: nix-forge/ci/actions/repository-checks@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
        with:
          dev-shell: ci
          publication-script: .github/scripts/scan-publication.sh
      - name: Report formatting changes after failed hooks
        if: failure()
        run: git diff --stat
      - name: Build portable lint checks
        uses: nix-forge/ci/actions/flake-checks@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
        with:
          system: x86_64-linux
          checks-output: hostedLintChecks
          cores: 4
  submodule-hooks:
    needs: [static]
    name: Submodule hooks
    runs-on: ubuntu-24.04
    # Child repositories have independent compiler and hook closures. Give
    # their validation its own budget instead of sharing the root lint job.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
        with:
          cache: 'false'
          cache-scope: ci-submodule-hooks
      - name: Run submodule hooks
        run: |
          git submodule foreach --recursive '
            nix develop --command bash -c "prek run --all-files && gitleaks git --redact --no-banner"
          '
  flake:
    needs: [static]
    name: Flake checks (${{ matrix.system }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Set up Nix
        id: nix-setup
        uses: nix-forge/ci/actions/setup-nix@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
        with:
          cache: ${{ github.event_name == 'workflow_dispatch' && inputs.use_nix_cache == true }}
          cache-scope: ci-native-${{ matrix.system }}
          cache-write-mode: read-only
      - name: Build native flake checks
        uses: nix-forge/ci/actions/flake-checks@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
        with:
          system: ${{ matrix.system }}
          checks-output: ciChecks
  native:
    needs: [static]
    name: Native packages (${{ matrix.label }})
    if: github.event_name == 'workflow_dispatch' && inputs.build_native_packages == true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            label: x86_64-linux 1/4
            runner: ubuntu-24.04
            package-count: 4
            package-index: 0
          - system: x86_64-linux
            label: x86_64-linux 2/4
            runner: ubuntu-24.04
            package-count: 4
            package-index: 1
          - system: x86_64-linux
            label: x86_64-linux 3/4
            runner: ubuntu-24.04
            package-count: 4
            package-index: 2
          - system: x86_64-linux
            label: x86_64-linux 4/4
            runner: ubuntu-24.04
            package-count: 4
            package-index: 3
          - system: aarch64-linux
            label: aarch64-linux 1/2
            runner: ubuntu-24.04-arm
            package-count: 2
            package-index: 0
          - system: aarch64-linux
            label: aarch64-linux 2/2
            runner: ubuntu-24.04-arm
            package-count: 2
            package-index: 1
          - system: aarch64-darwin
            label: aarch64-darwin
            runner: macos-26
            package-count: 1
            package-index: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
        with:
          # Keep the large, opt-in package audit out of the shared cache. The
          # normal checks provide a smaller cache surface.
          cache: 'false'
          cache-scope: ci-native-${{ matrix.system }}
      - name: Build changed native packages
        id: native-build
        shell: bash
        env:
          TARGET_SYSTEM: ${{ matrix.system }}
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha
            }}
          PACKAGE_COUNT: ${{ matrix.package-count }}
          PACKAGE_INDEX: ${{ matrix.package-index }}
        run: |
          set -euo pipefail
          # Reject stale locks before evaluation can resolve a different input.
          lock_flags=(--no-update-lock-file)
          build_log="${RUNNER_TEMP}/nix-build-${TARGET_SYSTEM}-${PACKAGE_INDEX}.log"

          if [ "${TARGET_SYSTEM}" = "aarch64-darwin" ]; then
            selected=$(nix run "${lock_flags[@]}" --option min-free 0 --option max-free 0 .#native-package-selection -- nix-seal remindctl)
          else
            selected=$(nix run "${lock_flags[@]}" --option min-free 0 --option max-free 0 .#native-package-selection --)
          fi
          selected_lines=$(jq -r --argjson count "$PACKAGE_COUNT" --argjson index "$PACKAGE_INDEX" \
            'to_entries[] | select(.key % $count == $index) | .value' <<<"$selected")
          if [[ -z $selected_lines ]]; then
            echo 'No eligible native package derivations in this package shard.'
            exit 0
          fi
          build_attrs=()
          while IFS= read -r build_attr; do
            build_attrs+=("$build_attr")
          done <<<"$selected_lines"
          printf 'Building changed output: %s\n' "${build_attrs[@]}"

          if [ "${TARGET_SYSTEM}" = "aarch64-darwin" ]; then
            build_status=0
            for build_attr in "${build_attrs[@]}"; do
              if ! nix build "${lock_flags[@]}" --max-jobs 1 --cores 0 --option eval-cores 1 --keep-going --show-trace --print-build-logs --no-link \
                "${build_attr}" >>"${build_log}" 2>&1; then
                build_status=1
              fi
              nix store gc >>"${build_log}" 2>&1 || true
            done
          else
            set +e
            nix build "${lock_flags[@]}" --max-jobs 1 --cores 0 --option eval-cores 1 --keep-going --show-trace --print-build-logs --no-link \
              "${build_attrs[@]}" >"${build_log}" 2>&1
            build_status=$?
            set -e
          fi

          if [ "${build_status}" -ne 0 ]; then
            tail -n 200 "${build_log}"
            exit "${build_status}"
          fi
          tail -n 40 "${build_log}"
      - name: Upload native Nix build log
        if: always() && steps.native-build.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nix-build-log-${{ matrix.system }}-${{ matrix.package-index }}
          path: ${{ runner.temp }}/nix-build-${{ matrix.system }}-${{ matrix.package-index }}.log
          if-no-files-found: error
  tests:
    name: Repository tests
    needs: [static, lint, flake, native, submodule-hooks]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require static checks and library tests to pass
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          FLAKE_RESULT: ${{ needs.flake.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          SUBMODULE_RESULT: ${{ needs.submodule-hooks.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$LINT_RESULT" = success
          test "$FLAKE_RESULT" = success
          test "$SUBMODULE_RESULT" = success
          test "$NATIVE_RESULT" = success || test "$NATIVE_RESULT" = skipped
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/',
      github.event.repository.default_branch))
    needs:
      - lock-health
      - discover
      - legacy-secret-manager-symbols
      - flake-lock
      - lint
      - static
      - submodule-hooks
      - flake
      - native
      - tests
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch the trusted queue reconciler after validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
