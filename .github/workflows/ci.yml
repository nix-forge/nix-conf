name: CI Tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      prove_actual_runtime:
        description: Verify unmodified Actual source, package and installed Node24 runtime.
        required: false
        default: false
        type: boolean
      prove_package_fixes:
        description: Select native package repair proofs without changing review guards.
        required: false
        default: none
        type: choice
        options: [none, darwin, deploy, linux, hyprland, all]
      prove_prism_watch:
        description: Measure native Prism watcher capability and verify actual resource cases.
        required: false
        default: false
        type: boolean
      prove_zen_wrapper:
        description: Verify native repaired Zen wrapper invariants and ordinary Firefox preservation.
        required: false
        default: false
        type: boolean
      prove_stylix_nvf:
        description: Independently evaluate current upstream and repaired Stylix Neovim behavior.
        required: false
        default: false
        type: boolean
      prove_swift_hardening:
        description: Independently verify current upstream and repaired Swift hardening.
        required: false
        default: false
        type: boolean
      prove_sentry_lock:
        description: Independently verify current upstream and repaired Sentry lock behavior.
        required: false
        default: false
        type: boolean
      base_sha:
        description: Base commit for native package comparison.
        required: false
        type: string
      build_native_packages:
        description: Build changed native packages in the explicit package audit.
        required: false
        default: false
        type: boolean
      use_nix_cache:
        description: Enable the bounded GitHub Nix store cache for a manual benchmark.
        required: false
        default: false
        type: boolean
  merge_group:
    types: [checks_requested]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name
    == 'workflow_dispatch' && (contains(fromJSON('["darwin","deploy","linux","hyprland","all"]'), inputs.prove_package_fixes)
    || inputs.prove_actual_runtime == true || inputs.prove_prism_watch == true || inputs.prove_zen_wrapper
    == true || inputs.prove_stylix_nvf == true || inputs.prove_swift_hardening == true || inputs.prove_sentry_lock
    == true) && format('-proof-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  actual-review-proof:
    name: Review current unmodified Actual package and runtime
    if: github.event_name == 'workflow_dispatch' && inputs.prove_actual_runtime
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
      - name: Record selected Actual package and native runtime
        run: nix eval --impure --json --file overlays/temporary/tests/current-actual-proof.nix metadata
      - name: Verify source layout and unmodified packaged service
        run: |
          nix build --option sandbox true --impure --no-link -L --max-jobs 1 --cores 2 \
            --file overlays/temporary/tests/current-actual-proof.nix \
            sourceLayout rawPackage rawRuntime regression
  package-fixes-review-proof:
    name: Review current package fix (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["darwin","deploy","linux","hyprland","all"]'),
      inputs.prove_package_fixes)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      # Consume the root's existing trusted cache; these proofs publish no outputs.
      NIX_CONFIG: |
        extra-substituters = https://hyprland.cachix.org
        extra-trusted-public-keys = hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON( inputs.prove_package_fixes == 'deploy' && '[ {"target":"deploy","runner":"macos-26","proof":"current-darwin-package-proof.nix"}
          ]' || inputs.prove_package_fixes == 'darwin' && '[ {"target":"determinate","runner":"macos-26","proof":"current-darwin-package-proof.nix"},
          {"target":"nh","runner":"macos-26","proof":"current-darwin-package-proof.nix"}, {"target":"claude","runner":"macos-26","proof":"current-darwin-package-proof.nix"},
          {"target":"deploy","runner":"macos-26","proof":"current-darwin-package-proof.nix"} ]' || inputs.prove_package_fixes
          == 'linux' && '[ {"target":"gtk","runner":"ubuntu-24.04","proof":"current-package-fixes-proof.nix"},
          {"target":"hypridle","runner":"ubuntu-24.04","proof":"current-package-fixes-proof.nix"}, {"target":"hyprshell","runner":"ubuntu-24.04","proof":"current-package-fixes-proof.nix"},
          {"target":"nom","runner":"ubuntu-24.04","proof":"current-package-fixes-proof.nix"}, {"target":"audioMuse","runner":"ubuntu-24.04","proof":"current-package-fixes-proof.nix"}
          ]' || inputs.prove_package_fixes == 'hyprland' && '[ {"target":"hyprland","runner":"ubuntu-24.04","proof":"current-hyprland-proof.nix"}
          ]' || inputs.prove_package_fixes == 'all' && '[ {"target":"gtk","runner":"ubuntu-24.04","proof":"current-package-fixes-proof.nix"},
          {"target":"hypridle","runner":"ubuntu-24.04","proof":"current-package-fixes-proof.nix"}, {"target":"hyprshell","runner":"ubuntu-24.04","proof":"current-package-fixes-proof.nix"},
          {"target":"hyprland","runner":"ubuntu-24.04","proof":"current-hyprland-proof.nix"}, {"target":"nom","runner":"ubuntu-24.04","proof":"current-package-fixes-proof.nix"},
          {"target":"audioMuse","runner":"ubuntu-24.04","proof":"current-package-fixes-proof.nix"}, {"target":"determinate","runner":"macos-26","proof":"current-darwin-package-proof.nix"},
          {"target":"nh","runner":"macos-26","proof":"current-darwin-package-proof.nix"}, {"target":"claude","runner":"macos-26","proof":"current-darwin-package-proof.nix"},
          {"target":"deploy","runner":"macos-26","proof":"current-darwin-package-proof.nix"} ]' || '[]')
          }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
      - name: Record actual packages and preserved regression suites
        env:
          PROOF_FILE: overlays/temporary/tests/${{ matrix.proof }}
        run: nix eval --impure --json --file "$PROOF_FILE" metadata
      - name: Verify the software parent and unmodified compositor startup
        if: matrix.target == 'hyprland'
        env:
          PROOF_FILE: overlays/temporary/tests/${{ matrix.proof }}
        run: |
          nix build --option sandbox true --impure --no-link -L --max-jobs 1 --cores 2 \
            --file "$PROOF_FILE" hyprlandParent
      - name: Build native package and exercise its regression suite
        env:
          TARGET: ${{ matrix.target }}
          PROOF_FILE: overlays/temporary/tests/${{ matrix.proof }}
        run: |
          targets=("$TARGET")
          if [[ "$TARGET" == hypridle ]]; then targets+=(hypridleBaseline); fi
          if [[ "$TARGET" == determinate ]]; then targets+=(determinateFunctional regression); fi
          nix build --option sandbox true --impure --no-link -L --max-jobs 1 --cores 2 \
            --file "$PROOF_FILE" "${targets[@]}"
      - name: Verify the exact native capability-dependent baseline
        if: ${{ !cancelled() && matrix.target == 'determinate' }}
        env:
          TARGET: ${{ matrix.target }}
          PROOF_FILE: overlays/temporary/tests/${{ matrix.proof }}
        run: |
          baseline=rawSentryDenied
          nix build --option sandbox true --impure --no-link -L --max-jobs 1 --cores 2 \
            --file "$PROOF_FILE" "$baseline"
      - name: Compare identical Deploy watcher binaries in sandbox and on host
        if: ${{ !cancelled() && matrix.target == 'deploy' }}
        run: |
          proof_file=overlays/temporary/tests/current-deploy-watch-proof.nix
          proof=
          report_pair() {
            status=$?
            trap - EXIT
            set +e
            for directory in "${proof:+$proof/strict}" "$RUNNER_TEMP/deploy-watch-host"; do
              [[ -d "$directory" ]] || continue
              for filename in status.json test.log fsevents.json watch-1.json watch-1.log watch-2.json watch-2.log; do
                [[ -f "$directory/$filename" ]] || continue
                printf '::group::Deploy watcher evidence %s/%s\n' "$directory" "$filename"
                sed -n '1,80p' "$directory/$filename"
                printf '\n::endgroup::\n'
              done
            done
            exit "$status"
          }
          trap report_pair EXIT
          nix eval --impure --json --file "$proof_file" metadata
          proof=$(nix build --option sandbox true --impure --no-link --print-out-paths -L \
            --max-jobs 1 --cores 2 --file "$proof_file" strictDiagnostic)
          python3 - <<'PYDIR'
          import json
          import os
          import tempfile
          from pathlib import Path
          print(json.dumps({
              "hostTmpdirEnvironment": os.environ.get("TMPDIR"),
              "hostTemporaryDirectory": tempfile.gettempdir(),
              "hostResolvedTemporaryDirectory": str(Path(tempfile.gettempdir()).resolve()),
          }))
          PYDIR
          python3 "$proof/compare.py" record "$proof/bin/activate-tests" \
            "$proof/bin/fsevents-probe" "$RUNNER_TEMP/deploy-watch-host"
          python3 "$proof/compare.py" compare "$proof/strict" "$RUNNER_TEMP/deploy-watch-host"
      - name: Inspect installed Claude entrypoint and native loader
        if: matrix.target == 'claude'
        run: |
          package=$(nix build --option sandbox true --impure --no-link --print-out-paths \
            --file overlays/temporary/tests/current-darwin-package-proof.nix claude)
          test -x "$package/bin/claude"
          vendor="$package/bin/.claude-wrapped"
          test -x "$vendor"
          /usr/bin/lipo "$vendor" -verify_arch arm64
          /usr/bin/otool -L "$vendor"
          # Inspect the vendor signature without executing its binary or
          # claiming notarization, certificate trust, or runtime correctness.
          status=0
          /usr/bin/codesign --display --verbose=4 "$vendor" > "$RUNNER_TEMP/claude-signature.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/claude-signature.txt"
          if [[ "$status" == 0 ]]; then
            /usr/bin/codesign --verify --strict "$vendor"
          else
            grep -F 'code object is not signed at all' "$RUNNER_TEMP/claude-signature.txt"
          fi
  prism-review-proof:
    name: Review current Prism watch capability
    if: github.event_name == 'workflow_dispatch' && inputs.prove_prism_watch
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
      - name: Record exact selected package and enabled checks
        run: nix eval --impure --json --file overlays/temporary/tests/current-prism-proof.nix metadata
      - name: Measure capability and verify full native watch cases
        run: |
          nix build --option sandbox true --impure --no-link -L --max-jobs 1 --cores 2 \
            --file overlays/temporary/tests/current-prism-proof.nix \
            upstreamBehavior currentBehavior improvedBehavior checkerRegression
      - name: Execute real watch integration with host capability
        run: |
          proof=$(nix build --option sandbox true --impure --no-link --print-out-paths \
            --file overlays/temporary/tests/current-prism-proof.nix capabilityPresent)
          "$proof/bin/prism-watch-capability-present"
  zen-wrapper-review-proof:
    name: Review current browser wrapper invariants
    if: github.event_name == 'workflow_dispatch' && inputs.prove_zen_wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
      - name: Record exact wrapper inputs
        run: nix eval --impure --json --file overlays/temporary/tests/current-zen-wrapper-proof.nix metadata
      - name: Build and exercise actual selected wrapper
        run: |
          nix build --option sandbox true --impure --no-link -L --max-jobs 1 --cores 2 \
            --file overlays/temporary/tests/current-zen-wrapper-proof.nix zen firefox
  stylix-review-proof:
    name: Review current Stylix Neovim behavior
    if: github.event_name == 'workflow_dispatch' && inputs.prove_stylix_nvf
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
      - name: Compare actual module warnings and canonical theme
        run: nix eval --impure --json --file overlays/temporary/tests/current-stylix-proof.nix
  sentry-review-proof:
    name: Review current Sentry lock behavior
    if: github.event_name == 'workflow_dispatch' && inputs.prove_sentry_lock
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
      - name: Record exact selected dependency
        run: nix eval --impure --json --file overlays/temporary/tests/current-sentry-proof.nix metadata
      - name: Verify upstream symptom, repaired behavior and patch lifecycle
        run: |
          nix build --option sandbox true --impure --no-link -L --max-jobs 1 --cores 2 \
            --file overlays/temporary/tests/current-sentry-proof.nix \
            upstream crashpad-lock lifecycle
  swift-review-proof:
    name: Review current Swift hardening
    if: github.event_name == 'workflow_dispatch' && inputs.prove_swift_hardening
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
      - name: Record exact selected compiler
        run: nix eval --impure --json --file overlays/temporary/tests/current-swift-proof.nix metadata
      - name: Verify missing upstream flags and repaired native runtime
        run: |
          nix build --option sandbox true --impure --no-link -L --max-jobs 1 --cores 2 \
            --file overlays/temporary/tests/current-swift-proof.nix upstream repaired
  discover:
    name: Discover CI inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lockfiles: ${{ steps.inventory.outputs.lockfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inventory
        uses: nix-forge/ci/actions/discover-lockfiles@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
  legacy-secret-manager-symbols:
    name: Reject removed secret-manager runtime references
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          if git grep -nEi 'secret[c]tl|secret[I]ndex|config[.]age[.]secrets|inputs[.]agenix' -- . ':(exclude).gitleaksignore'; then
            echo 'removed secret-manager symbols or agenix runtime references found' >&2
            exit 1
          fi
  lock-health:
    name: Flake lock health
    needs: [flake-lock]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every discovered lockfile to pass
        env:
          LOCK_RESULT: ${{ needs.flake-lock.result }}
        run: test "$LOCK_RESULT" = success
  flake-lock:
    needs: [discover]
    name: Flake lock health (${{ matrix.lockfile }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lockfile: ${{ fromJSON(needs.discover.outputs.lockfiles) }}
    uses: nix-forge/ci/.github/workflows/flake-lock.yml@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
    with:
      lockfile: ${{ matrix.lockfile }}
  lint:
    name: Repository hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
        with:
          cache: 'false'
          cache-scope: ci-lint
      - name: Check shared workflow contracts
        uses: nix-forge/ci/actions/validate-workflows@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
      - name: Run repository hooks and publication checks
        uses: nix-forge/ci/actions/repository-checks@13ad6e366ec01e317705d750fc512d33ecc15f6c # v2.9.0
        with:
          dev-shell: ci
          publication-script: .github/scripts/scan-publication.sh
      - name: Report formatting changes after failed hooks
        if: failure()
        run: git diff --stat
      - name: Build portable lint checks
        uses: nix-forge/ci/actions/flake-checks@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
        with:
          system: x86_64-linux
          checks-output: lintChecks
          cores: 4
      - name: Test native package selection
        run: nix develop .#tests --command python3 -m pytest -m nix_daemon tests/ci
      - name: Run submodule hooks
        run: |
          git submodule foreach --recursive '
            nix develop --command bash -c "prek run --all-files && gitleaks git --redact --no-banner"
          '
  flake:
    needs: [package-fixes-review-proof]
    name: Flake checks (${{ matrix.label }})
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && (needs.package-fixes-review-proof.result == 'success' || needs.package-fixes-review-proof.result
      == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    # The paired x86 VM may compile both compositor variants on a cold runner.
    timeout-minutes: ${{ matrix.system == 'x86_64-linux' && 90 || 45 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            label: x86_64-linux 1/6
            runner: ubuntu-24.04
            build-cores: 4
            partition-count: 6
            partition-index: 0
          - system: x86_64-linux
            label: x86_64-linux 2/6
            runner: ubuntu-24.04
            build-cores: 4
            partition-count: 6
            partition-index: 1
          - system: x86_64-linux
            label: x86_64-linux 3/6
            runner: ubuntu-24.04
            build-cores: 4
            partition-count: 6
            partition-index: 2
          - system: x86_64-linux
            label: x86_64-linux 4/6
            runner: ubuntu-24.04
            build-cores: 4
            partition-count: 6
            partition-index: 3
          - system: x86_64-linux
            label: x86_64-linux 5/6
            runner: ubuntu-24.04
            build-cores: 4
            partition-count: 6
            partition-index: 4
          - system: x86_64-linux
            label: x86_64-linux 6/6
            runner: ubuntu-24.04
            build-cores: 4
            partition-count: 6
            partition-index: 5
          - system: aarch64-linux
            label: aarch64-linux 1/4
            runner: ubuntu-24.04-arm
            build-cores: 4
            partition-count: 4
            partition-index: 0
          - system: aarch64-linux
            label: aarch64-linux 2/4
            runner: ubuntu-24.04-arm
            build-cores: 4
            partition-count: 4
            partition-index: 1
          - system: aarch64-linux
            label: aarch64-linux 3/4
            runner: ubuntu-24.04-arm
            build-cores: 4
            partition-count: 4
            partition-index: 2
          - system: aarch64-linux
            label: aarch64-linux 4/4
            runner: ubuntu-24.04-arm
            build-cores: 4
            partition-count: 4
            partition-index: 3
          - system: aarch64-darwin
            label: aarch64-darwin
            runner: macos-26
            build-cores: 3
            partition-count: 1
            partition-index: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Set up Nix
        id: nix-setup
        uses: nix-forge/ci/actions/setup-nix@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
        with:
          cache: ${{ github.event_name == 'workflow_dispatch' && inputs.use_nix_cache == true }}
          cache-scope: ci-${{ matrix.system }}
      - name: Record runner resource policy
        env:
          BUILD_CORES: ${{ matrix.build-cores }}
          CACHE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.use_nix_cache == true
            }}
          CACHE_HIT: ${{ steps.nix-setup.outputs.cache-hit }}
        run: |
          {
            echo '### Nix resource policy'
            echo "Build cores per active check: ${BUILD_CORES}"
            echo 'Nix jobs per runner: 1'
            echo "GitHub Nix cache requested: ${CACHE_REQUESTED}"
            echo "GitHub Nix cache restored: ${CACHE_HIT:-false}"
          } >>"${GITHUB_STEP_SUMMARY}"
      - name: Build assigned native CI checks
        # Fixed upstream cache policy, downloading without publication credentials.
        env:
          NIX_CONFIG: |
            sandbox = true
            sandbox-fallback = false
            extra-substituters = https://hyprland.cachix.org
            extra-trusted-public-keys = hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=
        uses: nix-forge/ci/actions/flake-checks@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
        with:
          system: ${{ matrix.system }}
          checks-output: ciChecks
          cores: ${{ matrix.build-cores }}
          partition-count: ${{ matrix.partition-count }}
          partition-index: ${{ matrix.partition-index }}
          weights-file: .github/ci-check-weights.json
      - name: Check native Core Text selection and shaping
        if: matrix.system == 'aarch64-darwin'
        shell: bash
        run: |
          selection=$(nix build --no-link --print-out-paths .#checks.aarch64-darwin.font-selection)
          xcrun swift tests/fonts/check_coretext.swift "$selection/selection.json"
  guide-changes:
    name: Discover public guide changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha
            }}
        run: |
          if [[ -z "$BASE_SHA" ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" HEAD -- \
            .github/workflows/ci.yml flake.nix flake.lock flake \
            templates tests/public-guide modules lib scripts homes hosts \
            nix-config-framework nix-homelab nix-seal pkgs; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  public-guide:
    name: Public guide (${{ matrix.system }}, ${{ matrix.scenario }})
    needs: [guide-changes]
    if: needs.guide-changes.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux, aarch64-darwin]
        scenario: [templates, vm, interfaces, all]
        exclude:
          - system: x86_64-linux
            scenario: all
          - system: aarch64-linux
            scenario: vm
          - system: aarch64-linux
            scenario: all
          - system: aarch64-darwin
            scenario: templates
          - system: aarch64-darwin
            scenario: vm
          - system: aarch64-darwin
            scenario: interfaces
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
            build-cores: 4
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            build-cores: 4
          - system: aarch64-darwin
            runner: macos-26
            build-cores: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Set up Nix
        id: nix-setup
        uses: nix-forge/ci/actions/setup-nix@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
        with:
          cache: ${{ github.event_name == 'workflow_dispatch' && inputs.use_nix_cache == true }}
          cache-scope: ci-${{ matrix.system }}
      - name: Check extracted public templates and module consumers
        env:
          GUIDE_SYSTEM: ${{ matrix.system }}
          GUIDE_SCENARIO: ${{ matrix.scenario }}
          PUBLIC_GUIDE_BUILD_CORES: ${{ matrix.build-cores }}
        run: bash tests/public-guide/check-consumers.sh "$PWD" "$GUIDE_SYSTEM" "$GUIDE_SCENARIO"
  native:
    name: Native packages (${{ matrix.label }})
    if: github.event_name == 'workflow_dispatch' && inputs.build_native_packages == true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            label: x86_64-linux 1/4
            runner: ubuntu-24.04
            package-count: 4
            package-index: 0
          - system: x86_64-linux
            label: x86_64-linux 2/4
            runner: ubuntu-24.04
            package-count: 4
            package-index: 1
          - system: x86_64-linux
            label: x86_64-linux 3/4
            runner: ubuntu-24.04
            package-count: 4
            package-index: 2
          - system: x86_64-linux
            label: x86_64-linux 4/4
            runner: ubuntu-24.04
            package-count: 4
            package-index: 3
          - system: aarch64-linux
            label: aarch64-linux 1/2
            runner: ubuntu-24.04-arm
            package-count: 2
            package-index: 0
          - system: aarch64-linux
            label: aarch64-linux 2/2
            runner: ubuntu-24.04-arm
            package-count: 2
            package-index: 1
          - system: aarch64-darwin
            label: aarch64-darwin
            runner: macos-26
            package-count: 1
            package-index: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
        with:
          # Keep the large, opt-in package audit out of the shared cache. The
          # normal check and guide jobs are the safe cache benchmark surface.
          cache: 'false'
          cache-scope: ci-native-${{ matrix.system }}
      - name: Build changed native packages
        id: native-build
        shell: bash
        env:
          TARGET_SYSTEM: ${{ matrix.system }}
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha
            }}
          PACKAGE_COUNT: ${{ matrix.package-count }}
          PACKAGE_INDEX: ${{ matrix.package-index }}
        run: |
          set -euo pipefail
          build_log="${RUNNER_TEMP}/nix-build-${TARGET_SYSTEM}-${PACKAGE_INDEX}.log"

          if [ "${TARGET_SYSTEM}" = "aarch64-darwin" ]; then
            selected=$(bash .github/scripts/select-native-packages.sh nix-seal remindctl)
          else
            selected=$(bash .github/scripts/select-native-packages.sh)
          fi
          selected_lines=$(jq -r --argjson count "$PACKAGE_COUNT" --argjson index "$PACKAGE_INDEX" \
            'to_entries[] | select(.key % $count == $index) | .value' <<<"$selected")
          if [[ -z $selected_lines ]]; then
            echo 'No eligible native package derivations in this package shard.'
            exit 0
          fi
          build_attrs=()
          while IFS= read -r build_attr; do
            build_attrs+=("$build_attr")
          done <<<"$selected_lines"
          printf 'Building changed output: %s\n' "${build_attrs[@]}"

          if [ "${TARGET_SYSTEM}" = "aarch64-darwin" ]; then
            build_status=0
            for build_attr in "${build_attrs[@]}"; do
              if ! nix build --max-jobs 1 --cores 0 --option eval-cores 1 --keep-going --show-trace --print-build-logs --no-link \
                "${build_attr}" >>"${build_log}" 2>&1; then
                build_status=1
              fi
              nix store gc >>"${build_log}" 2>&1 || true
            done
          else
            set +e
            nix build --max-jobs 1 --cores 0 --option eval-cores 1 --keep-going --show-trace --print-build-logs --no-link \
              "${build_attrs[@]}" >"${build_log}" 2>&1
            build_status=$?
            set -e
          fi

          if [ "${build_status}" -ne 0 ]; then
            tail -n 200 "${build_log}"
            exit "${build_status}"
          fi
          tail -n 40 "${build_log}"
      - name: Upload native Nix build log
        if: always() && steps.native-build.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nix-build-log-${{ matrix.system }}-${{ matrix.package-index }}
          path: ${{ runner.temp }}/nix-build-${{ matrix.system }}-${{ matrix.package-index }}.log
          if-no-files-found: error
  tests:
    name: Repository tests
    needs: [flake, guide-changes, public-guide, native]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the Nix test matrix to pass
        env:
          FLAKE_RESULT: ${{ needs.flake.result }}
          GUIDE_CHANGED: ${{ needs.guide-changes.outputs.changed }}
          GUIDE_RESULT: ${{ needs.public-guide.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$FLAKE_RESULT" = success
          if [[ "$GUIDE_CHANGED" == true ]]; then
            test "$GUIDE_RESULT" = success
          else
            test "$GUIDE_CHANGED" = false
            test "$GUIDE_RESULT" = skipped
          fi
          test "$NATIVE_RESULT" = success || test "$NATIVE_RESULT" = skipped
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/',
      github.event.repository.default_branch))
    needs:
      - actual-review-proof
      - package-fixes-review-proof
      - prism-review-proof
      - sentry-review-proof
      - swift-review-proof
      - stylix-review-proof
      - zen-wrapper-review-proof
      - lock-health
      - discover
      - legacy-secret-manager-symbols
      - flake-lock
      - lint
      - flake
      - guide-changes
      - public-guide
      - native
      - tests
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch the trusted queue reconciler after validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
