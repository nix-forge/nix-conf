name: Python fixture diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: aee04fbd4c8f17feefc2946a06c013b4facbb857
          submodules: recursive
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af
        with:
          extra-conf: |
            extra-experimental-features = auto-allocate-uids cgroups
            auto-allocate-uids = true
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55
      - name: Apply frozen fixture patch and record source identity
        env:
          FIXTURE_: 
        run: |
          git rev-parse HEAD
          printf '%s' "$FIXTURE_" | base64 --decode > /tmp/python-fixtures.patch
          echo 'e722cc107c666b697736fd4fed723b5bef439be0ff6903ea30fad5a4a60cedb9  /tmp/python-fixtures.patch' | sha256sum --check
          git apply --check /tmp/python-fixtures.patch
          git apply /tmp/python-fixtures.patch
          git diff --stat
      - name: Run the complete real Python behavior derivation
        env:
          NIX_CONFIG: |
            sandbox = true
            sandbox-fallback = false
        run: nix build --no-link --print-build-logs --max-jobs 1 --cores 4 .#checks.x86_64-linux.python-tests
