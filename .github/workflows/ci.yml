name: Root input graph reconciliation
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: root-input-graph-reconciliation
  cancel-in-progress: false
jobs:
  lock:
    name: Reconcile all declared lock graphs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
      - name: Resolve graphs through actual declared follows
        run: |
          mkdir -p .scratch/input-receipt
          git rev-parse HEAD > .scratch/input-receipt/source.txt
          git submodule status --recursive >> .scratch/input-receipt/source.txt
          nix flake lock
          nix flake lock ./flake/dev
          nix flake lock ./templates/darwin
          nix flake lock ./templates/starter
          cp flake.lock .scratch/input-receipt/root.lock
          cp flake/dev/flake.lock .scratch/input-receipt/dev.lock
          cp templates/darwin/flake.lock .scratch/input-receipt/darwin.lock
          cp templates/starter/flake.lock .scratch/input-receipt/starter.lock
          git diff --binary > .scratch/input-receipt/lock-graph.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: root-input-reconciliation
          path: .scratch/input-receipt
          include-hidden-files: true
