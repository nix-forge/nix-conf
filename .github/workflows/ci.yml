name: REA Darwin cached runtime qualification
on:
  workflow_dispatch:
permissions: {}
jobs:
  qualify:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2c7c56eb5a1d3078ef4e31bb2a22509bff2504bc
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55
      - name: Freeze candidate recipe and expression
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git -C pkgs fetch origin bc2006f46dbaa7a357df320b2eedd583027b64f4
          git -C pkgs checkout --detach bc2006f46dbaa7a357df320b2eedd583027b64f4
          git -C pkgs rev-parse HEAD
          cp -R pkgs/pkgs/by-name/re/rea "$RUNNER_TEMP/rea-cached-candidate"
          python3 - <<'CANDIDATE'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'rea-cached-candidate/package.nix'
          text=p.read_text()
          old='    stdenv.hostPlatform.isLinux\n    && lib.versions.major nodejs_24.version == "24"'
          assert text.count(old)==1
          p.write_text(text.replace(old, '    lib.versions.major nodejs_24.version == "24"'))
          CANDIDATE
          cat > "$RUNNER_TEMP/rea-cache.nix" <<'EXPRESSION'
          let
            root = builtins.getFlake ("git+file://" + builtins.getEnv "PWD" + "?submodules=1&rev=2c7c56eb5a1d3078ef4e31bb2a22509bff2504bc");
            pkgs = import root.inputs.nixpkgs-apps { system = "aarch64-darwin"; };
            rea = pkgs.callPackage (builtins.toPath (builtins.getEnv "RUNNER_TEMP" + "/rea-cached-candidate/package.nix")) {};
          in {
            node = pkgs.nodejs_24;
            source = pkgs.nodejs_24.src;
            app = assert rea.reuseUpstreamNode;
              assert rea.buildNodejs.drvPath == pkgs.nodejs_24.drvPath;
              assert rea.runtimeNodejs.drvPath == pkgs.nodejs_24.drvPath;
              assert rea.doCheck && rea.doInstallCheck;
              rea;
          }
          EXPRESSION
      - name: Require signed cached Node with compilation disabled
        shell: bash
        run: |
          set -euo pipefail
          node=$(nix build --impure --file "$RUNNER_TEMP/rea-cache.nix" node --no-link --print-out-paths \
            --max-jobs 0 --option builders '' --option substituters https://cache.nixos.org --option require-sigs true)
          test "$node" = /nix/store/vxh4ylwcdwyqhils1q6084ih7l5qinwk-nodejs-24.22.2
          echo "CACHED_NODE=$node" >> "$GITHUB_ENV"
          "$node/bin/node" -p 'JSON.stringify(process.versions)'
      - name: Qualify unchanged upstream RSS regression
        id: rss
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source=$(nix build --impure --file "$RUNNER_TEMP/rea-cache.nix" source --no-link --print-out-paths --max-jobs 1 --option builders '')
          mkdir -p "$RUNNER_TEMP/node-runtime-tests"
          cp -R "$source/test" "$RUNNER_TEMP/node-runtime-tests/test"
          chmod -R u+w "$RUNNER_TEMP/node-runtime-tests"
          export JOBS=3
          "$CACHED_NODE/bin/node" --predictable-gc-schedule "$RUNNER_TEMP/node-runtime-tests/test/parallel/test-memory-usage.js"
          for attempt in 1 2 3; do
            echo "UPSTREAM_WORKER_MEMORY_ATTEMPT=$attempt"
            "$CACHED_NODE/bin/node" "$RUNNER_TEMP/node-runtime-tests/test/parallel/test-worker-memory.js"
          done
          echo UPSTREAM_RSS_REGRESSION=PASS
      - name: Build REA with full domain and install checks
        shell: bash
        run: |
          set -euo pipefail
          app=$(nix build --impure --file "$RUNNER_TEMP/rea-cache.nix" app --no-link --print-out-paths -L \
            --max-jobs 1 --cores 3 --option builders '' --option sandbox relaxed)
          skills=$(nix build --impure --file "$RUNNER_TEMP/rea-cache.nix" app.skills --no-link --print-out-paths --max-jobs 1 --cores 3 --option builders '' --option sandbox relaxed)
          echo "CACHED_REA=$app" >> "$GITHUB_ENV"
          "$CACHED_NODE/bin/node" pkgs/pkgs/by-name/re/rea/scripts/check-install.mts \
            "$app" "$skills" 6.8.0 /bin/bash
          echo CACHED_DARWIN_REA_INSTALLED_CHECKS=PASS
      - name: Require RSS and application qualification
        env:
          RSS_OUTCOME: ${{ steps.rss.outcome }}
        run: test "$RSS_OUTCOME" = success
