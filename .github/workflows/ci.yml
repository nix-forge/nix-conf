name: Refined import diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: afb0d46dd92b95a8e0a75375812b374d75167b27
          submodules: recursive
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af
        with:
          extra-conf: |
            extra-experimental-features = auto-allocate-uids
            auto-allocate-uids = true
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55
      - name: Record immutable source
        run: git rev-parse HEAD
      - name: Capture exact systemd diagnostics from the original fixture
        run: |
          cat > /tmp/refined-diagnostic.nix <<'NIX'
          let
            flake = builtins.getFlake ("git+file://" + builtins.getEnv "PWD" + "?shallow=1&submodules=1&rev=afb0d46dd92b95a8e0a75375812b374d75167b27");
            pkgs = flake.inputs.nixpkgs.legacyPackages.x86_64-linux;
            wrapper = pkgs.writeText "capture-tmpfiles.py" ''
              import runpy, subprocess, sys
              from pathlib import Path
              original_run = subprocess.run
              def capture(*args, **kwargs):
                  kwargs.update(capture_output=True, text=True, check=False)
                  result = original_run(*args, **kwargs)
                  print("COMMAND", repr(args), "STDOUT", repr(result.stdout), "STDERR", repr(result.stderr), flush=True)
                  result.check_returncode()
                  return result
              subprocess.run = capture
              sys.argv = sys.argv[1:]
              print("RULES", repr(Path(sys.argv[2]).read_text()), flush=True)
              runpy.run_path(sys.argv[0], run_name="__main__")
            '';
          in flake.checks.x86_64-linux.refined-github-import.overrideAttrs (old: {
            requiredSystemFeatures = [ "uid-range" ];
            SYSTEMD_LOG_TARGET = "console";
            SYSTEMD_LOG_LEVEL = "debug";
            SYSTEMD_LOG_COLOR = "0";
            buildCommand = ''
              chmod 0711 "$TMPDIR"
              mkdir -m 0700 "$TMPDIR/fixture-user"
              chown 1000:1000 "$TMPDIR/fixture-user"
            '' + builtins.replaceStrings
              [ "${pkgs.lib.getExe pkgs.python3} " ]
              [ "TMPDIR=$TMPDIR/fixture-user HOME=$TMPDIR/fixture-user ${pkgs.lib.getExe' pkgs.util-linux "setpriv"} --reuid 1000 --regid 1000 --clear-groups -- ${pkgs.lib.getExe pkgs.python3} ${wrapper} " ] old.buildCommand;
          })
          NIX
          nix build --option sandbox true --no-link --print-build-logs --impure --file /tmp/refined-diagnostic.nix
