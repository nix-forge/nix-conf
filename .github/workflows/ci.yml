name: CI Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  legacy-secret-manager-symbols:
    name: Reject removed secret-manager runtime references
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          if git grep -nEi 'secret[c]tl|secret[I]ndex|config[.]age[.]secrets|inputs[.]agenix' -- . ':(exclude).gitleaks.toml'; then
            echo 'removed secret-manager symbols or agenix runtime references found' >&2
            exit 1
          fi
  flake-lock:
    name: Flake lock health (${{ matrix.lockfile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lockfile:
          - flake.lock
          - flake/dev/flake.lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # v13
        with:
          flake-lock-path: ${{ matrix.lockfile }}
          ignore-missing-flake-lock: false
          fail-mode: true
          send-statistics: false
  lint:
    name: Repository hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Reclaim unused Nix store space
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          nix store gc
          df -h /
      - name: Materialize partition sources
        run: |
          nix store add-path flake/dev
          nix store add-path nix-seal/flake/dev
          nix store add-path pkgs/flake/dev
      - name: Run prek hooks
        run: nix develop --command prek run --all-files
      - name: Scan repository for leaked secrets
        run: nix develop --command gitleaks detect --source . --redact --no-banner
  flake:
    name: Flake checks (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Materialize partition sources
        run: |
          nix store add-path flake/dev
          nix store add-path nix-seal/flake/dev
          nix store add-path pkgs/flake/dev
      - name: Run flake checks
        shell: bash
        env:
          TARGET_SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          nix build --keep-going --show-trace --print-build-logs --no-link \
            ".#checks.${TARGET_SYSTEM}.treefmt" \
            ".#checks.${TARGET_SYSTEM}.local-control-database-validation"
      - name: Evaluate deployable configurations
        shell: bash
        env:
          TARGET_SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail

          case "${TARGET_SYSTEM}" in
            x86_64-linux)
              nix eval --raw '.#nixosConfigurations.desktop.config.system.build.toplevel.drvPath' >/dev/null
              nix eval --raw '.#homeConfigurations.ianmh@desktop.activationPackage.drvPath' >/dev/null
              ;;
            aarch64-darwin)
              nix eval --raw '.#darwinConfigurations.macbook-pro-m4.system.drvPath' >/dev/null
              nix eval --raw '.#homeConfigurations.ianmh@macbook-pro-m4.activationPackage.drvPath' >/dev/null
              ;;
          esac
      - name: Build native Nix outputs
        id: native-build
        shell: bash
        env:
          TARGET_SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          build_log="${RUNNER_TEMP}/nix-build-${TARGET_SYSTEM}.log"

          build_attrs=()
          while IFS= read -r build_attr; do
            build_attrs+=("${build_attr}")
          done < <(
            nix eval --json ".#packages.${TARGET_SYSTEM}" --apply builtins.attrNames |
              jq -r --arg system "${TARGET_SYSTEM}" '.[] | ".#packages.\($system).\(.)"'
          )

          if [ "${TARGET_SYSTEM}" = "aarch64-darwin" ]; then
              # The public macOS runner cannot materialize this repository's
              # complete closure within its disk quota. Configuration
              # evaluation above covers the deployable Darwin outputs; build
              # the representative public packages here instead.
              build_attrs=(
                '.#packages.aarch64-darwin.nix-seal'
                '.#packages.aarch64-darwin.remindctl'
              )
          fi

          # Full host and Home Manager closures pull in the complete desktop
          # application set and exceed the merge queue's practical response
          # window. The evaluation step validates those configurations while
          # native package builds retain materialization coverage on every PR.

          if [ "${TARGET_SYSTEM}" = "aarch64-darwin" ]; then
            # The hosted macOS runner has less free disk than the Linux runners.
            # Build each goal independently and collect unreferenced intermediates
            # between goals so the native matrix still covers every output.
            build_status=0
            for build_attr in "${build_attrs[@]}"; do
              if ! nix build --keep-going --show-trace --print-build-logs --no-link \
                "${build_attr}" >>"${build_log}" 2>&1; then
                build_status=1
              fi
              nix store gc >>"${build_log}" 2>&1 || true
            done
          else
            set +e
            nix build --keep-going --show-trace --print-build-logs --no-link "${build_attrs[@]}" >"${build_log}" 2>&1
            build_status=$?
            set -e
          fi

          if [ "${build_status}" -ne 0 ]; then
            tail -n 200 "${build_log}"
            exit "${build_status}"
          fi

          tail -n 40 "${build_log}"
      - name: Upload native Nix build log
        if: always() && steps.native-build.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-build-log-${{ matrix.system }}
          path: ${{ runner.temp }}/nix-build-${{ matrix.system }}.log
          if-no-files-found: error
  tests:
    name: Repository tests
    needs: [flake]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the Nix test matrix to pass
        env:
          FLAKE_RESULT: ${{ needs.flake.result }}
        run: test "$FLAKE_RESULT" = success
