name: Upstream consumer qualification
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Qualify all consumers or retry only the repaired BookOrbit service.
        type: choice
        default: all
        options: [all, bookorbit]
permissions: {}
concurrency:
  group: upstream-consumers-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: false
jobs:
  consumers:
    if: inputs.scope == 'all'
    name: Consumer contracts and hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
      - name: Freeze source identity and refresh path input hashes
        run: |
          mkdir receipt
          git rev-parse HEAD > receipt/source.txt
          git submodule status --recursive >> receipt/source.txt
          nix flake lock
          cp flake.lock receipt/flake.lock
      - name: Exercise vanilla integration and token owner behavior
        if: ${{ !cancelled() }}
        run: |
          nix develop .#tests --command pytest -q \
            tests/homelab/music/test_bootstrap_aurral.py \
            tests/homelab/music/test_listenbrainz_identity.py
      - name: Build affected generated configuration contracts
        if: ${{ !cancelled() }}
        run: |
          nix build --no-link -L \
            .#checks.x86_64-linux.codex-home \
            .#checks.x86_64-linux.module-independence \
            .#checks.x86_64-linux.linearmouse-config \
            .#checks.x86_64-linux.linearmouse-invalid-config \
            .#checks.x86_64-linux.linearmouse-external-schema \
            .#checks.x86_64-linux.temporary-package-fixes
      - name: Check repository hooks
        if: ${{ !cancelled() }}
        run: nix develop .#ci --command prek run --all-files --show-diff-on-failure
      - name: Record formatter edits and refreshed lock
        if: always()
        run: |
          mkdir -p receipt
          git diff --binary > receipt/qualification.patch
          cp flake.lock receipt/flake.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: upstream-consumer-receipt
          path: receipt
  linearmouse:
    if: inputs.scope == 'all'
    name: Unmodified upstream LinearMouse signature
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
      - name: Build and strictly verify the official application
        run: |
          out=$(nix build --no-link --print-out-paths -L \
            github:NixOS/nixpkgs/b3cff76391a4867236cc135b69a928d873b9f6d0#linearmouse)
          test -d "$out/Applications/LinearMouse.app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$out/Applications/LinearMouse.app"
  bookorbit:
    name: Upstream BookOrbit native recovery VM
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
      - name: Build and exercise startup, restart and restored database
        run: nix build --no-link -L ./nix-homelab#checks.x86_64-linux.bookorbit-native-recovery
  aurral:
    if: inputs.scope == 'all'
    name: Upstream Aurral (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
      - name: Build official application with original upstream test suites
        run: nix build --no-link -L github:NixOS/nixpkgs/b3cff76391a4867236cc135b69a928d873b9f6d0#aurral
      - name: Exercise upstream service startup and HTTP health
        if: matrix.system == 'x86_64-linux'
        run: |
          nix build --no-link -L --impure --expr \
            'let pkgs = import
              (builtins.getFlake "github:NixOS/nixpkgs/b3cff76391a4867236cc135b69a928d873b9f6d0")
              { system = builtins.currentSystem; };
            in pkgs.nixosTests.aurral'
