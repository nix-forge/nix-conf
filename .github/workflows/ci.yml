name: Reviewed input qualification
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable full source commit to qualify.
        type: string
        required: true
      scope:
        description: Recheck repaired probes without repeating the active Handy proof.
        type: choice
        default: all
        options: [all, repairs, preflight]
permissions: {}
concurrency:
  group: reviewed-root-inputs-${{ inputs.scope }}
  cancel-in-progress: false
jobs:
  linux:
    name: Reviewed input interfaces and upstream regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Require an immutable source commit
        env:
          REQUESTED_SOURCE: ${{ inputs.source_ref }}
        run: '[[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
      - name: Record exact source and all owned input revisions
        run: |
          mkdir -p .scratch/input-receipt
          git rev-parse HEAD > .scratch/input-receipt/source.txt
          git submodule status --recursive >> .scratch/input-receipt/source.txt
      - name: Check portable repository contracts
        if: inputs.scope != 'preflight'
        run: nix develop .#ci --command prek run --all-files --show-diff-on-failure
      - name: Verify moved CI ownership and isolated clocks
        if: inputs.scope != 'preflight'
        run: |
          nix develop .#tests --command pytest -q \
            tests/ci/test_ci_inventory.py \
            tests/workstation/test_workstation_memory.py \
            tests/hyprland/test_upstream_local_runner.py
      - name: Evaluate the complete desktop configuration without building it
        run: |
          nix eval --raw .#nixosConfigurations.desktop.config.system.build.toplevel.drvPath
          nix eval --raw .#checks.x86_64-linux.book-discovery.drvPath
          test "$(nix eval --json .#nixosConfigurations.raspberry-pi.config.boot.initrd.systemd.enable)" = true
      - name: Verify all guarded interfaces and retired-fix behavior
        if: inputs.scope != 'preflight' && !cancelled()
        run: |
          nix build --no-link -L \
            .#checks.x86_64-linux.temporary-package-fixes \
            .#checks.x86_64-linux.nu-scripts-pytest \
            .#checks.x86_64-linux.nushell-generated-config \
            .#checks.x86_64-linux.ghostty-bash-upstream \
            .#checks.x86_64-linux.nom-upstream-activities
      - name: Capture formatter changes without modifying published source
        if: always()
        run: git diff --binary > .scratch/input-receipt/formatting.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: root-reviewed-input-receipt
          path: .scratch/input-receipt
          include-hidden-files: true
  handy:
    if: inputs.scope == 'all'
    name: Repaired Handy strict Apple signature
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Require an immutable source commit
        env:
          REQUESTED_SOURCE: ${{ inputs.source_ref }}
        run: '[[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
      - name: Build the selected repair and verify actual app identity and signatures
        run: |
          artifact=$(nix build --no-link --print-out-paths -L .#checks.aarch64-darwin.handy-artifact)
          export HANDY_TEST_BUNDLE="$artifact/Applications/Handy.app"
          nix develop .#tests --command python3 tests/macos/test_handy_signature.py
  actual:
    if: inputs.scope != 'preflight'
    name: Unmodified upstream Actual installed log privacy
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Require an immutable source commit
        env:
          REQUESTED_SOURCE: ${{ inputs.source_ref }}
        run: '[[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
      - name: Evaluate the complete native configuration without building it
        run: nix eval --raw .#darwinConfigurations.macbook-pro-m4.config.system.build.toplevel.drvPath
      - name: Exercise the installed upstream service and its log privacy
        run: nix build --no-link -L .#checks.aarch64-darwin.actual-runtime
