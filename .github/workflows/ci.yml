name: CI Tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for native package comparison.
        required: false
        type: string
  merge_group:
    types: [checks_requested]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  discover:
    name: Discover CI inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lockfiles: ${{ steps.inventory.outputs.lockfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inventory
        uses: nix-forge/ci/actions/discover-lockfiles@2f7e422cb28527822d97fcb4327fb729480f82cf # v2.3.0
  legacy-secret-manager-symbols:
    name: Reject removed secret-manager runtime references
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          if git grep -nEi 'secret[c]tl|secret[I]ndex|config[.]age[.]secrets|inputs[.]agenix' -- . ':(exclude).gitleaksignore'; then
            echo 'removed secret-manager symbols or agenix runtime references found' >&2
            exit 1
          fi
  lock-health:
    name: Flake lock health
    needs: [flake-lock]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every discovered lockfile to pass
        env:
          LOCK_RESULT: ${{ needs.flake-lock.result }}
        run: test "$LOCK_RESULT" = success
  flake-lock:
    needs: [discover]
    name: Flake lock health (${{ matrix.lockfile }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lockfile: ${{ fromJSON(needs.discover.outputs.lockfiles) }}
    uses: nix-forge/ci/.github/workflows/flake-lock.yml@2f7e422cb28527822d97fcb4327fb729480f82cf # v2.3.0
    with:
      lockfile: ${{ matrix.lockfile }}
  lint:
    name: Repository hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@2f7e422cb28527822d97fcb4327fb729480f82cf # v2.3.0
        with:
          cache: 'false'
          cache-scope: ci-lint
      - name: Check shared workflow contracts
        uses: nix-forge/ci/actions/validate-workflows@2f7e422cb28527822d97fcb4327fb729480f82cf # v2.3.0
      - name: Run repository hooks and publication checks
        uses: nix-forge/ci/actions/repository-checks@2f7e422cb28527822d97fcb4327fb729480f82cf # v2.3.0
        with:
          dev-shell: ci
          publication-script: .github/scripts/scan-publication.sh
      - name: Test native package selection
        run: python3 -m unittest discover -s .github/tests
      - name: Run submodule hooks
        run: |
          git submodule foreach --recursive '
            nix develop --command bash -c "prek run --all-files && gitleaks git --redact --no-banner"
          '
  flake:
    name: Flake checks (${{ matrix.system }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.runner }}
    # This job includes integration checks and the full cold Linux package set.
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@2f7e422cb28527822d97fcb4327fb729480f82cf # v2.3.0
        with:
          cache: 'false'
          cache-scope: ci-flake
      - name: Build every declared native CI check
        uses: nix-forge/ci/actions/flake-checks@2f7e422cb28527822d97fcb4327fb729480f82cf # v2.3.0
        with:
          system: ${{ matrix.system }}
          checks-output: ciChecks
      - name: Check native Core Text selection and shaping
        if: matrix.system == 'aarch64-darwin'
        shell: bash
        run: |
          selection=$(nix build --no-link --print-out-paths .#checks.aarch64-darwin.font-selection)
          xcrun swift tests/fonts/check_coretext.swift "$selection/selection.json"
      - name: Build native Nix outputs
        id: native-build
        shell: bash
        env:
          TARGET_SYSTEM: ${{ matrix.system }}
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha
            }}
        run: |
          set -euo pipefail
          build_log="${RUNNER_TEMP}/nix-build-${TARGET_SYSTEM}.log"

          if [ "${TARGET_SYSTEM}" = "aarch64-darwin" ]; then
              # The public macOS runner cannot materialize this repository's
              # complete closure within its disk quota. Configuration
              # evaluation above covers the deployable Darwin outputs; build
              # the representative public packages here instead.
              build_attrs=(
                '.#packages.aarch64-darwin.nix-seal'
                '.#packages.aarch64-darwin.remindctl'
              )
          else
            selected=$(bash .github/scripts/select-native-packages.sh)
            selected_lines=$(jq -r '.[]' <<<"$selected")
            if [[ -z $selected_lines ]]; then
              echo 'All native package derivations are unchanged; integration checks passed above.'
              exit 0
            fi
            mapfile -t build_attrs <<<"$selected_lines"
            printf 'Building changed output: %s\n' "${build_attrs[@]}"
          fi

          # Full host and Home Manager closures pull in the complete desktop
          # application set and exceed the merge queue's practical response
          # window. The evaluation step validates those configurations while
          # native package builds materialize every changed Linux output and the
          # representative Darwin outputs on every PR.

          if [ "${TARGET_SYSTEM}" = "aarch64-darwin" ]; then
            # The hosted macOS runner has less free disk than the Linux runners.
            # Build each goal independently and collect unreferenced intermediates
            # between goals so the native matrix still covers every output.
            build_status=0
            for build_attr in "${build_attrs[@]}"; do
              if ! nix build --max-jobs 1 --cores 0 --option eval-cores 1 --keep-going --show-trace --print-build-logs --no-link \
                "${build_attr}" >>"${build_log}" 2>&1; then
                build_status=1
              fi
              nix store gc >>"${build_log}" 2>&1 || true
            done
          else
            set +e
            nix build --max-jobs 1 --cores 0 --option eval-cores 1 --keep-going --show-trace --print-build-logs --no-link \
              "${build_attrs[@]}" >"${build_log}" 2>&1
            build_status=$?
            set -e
          fi

          if [ "${build_status}" -ne 0 ]; then
            tail -n 200 "${build_log}"
            exit "${build_status}"
          fi

          tail -n 40 "${build_log}"
      - name: Upload native Nix build log
        if: always() && steps.native-build.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-build-log-${{ matrix.system }}
          path: ${{ runner.temp }}/nix-build-${{ matrix.system }}.log
          if-no-files-found: error
  tests:
    name: Repository tests
    needs: [flake]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the Nix test matrix to pass
        env:
          FLAKE_RESULT: ${{ needs.flake.result }}
        run: test "$FLAKE_RESULT" = success
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')
    needs: [lock-health, discover, legacy-secret-manager-symbols, flake-lock, lint, flake, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch the trusted queue reconciler after validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@2f7e422cb28527822d97fcb4327fb729480f82cf # v2.3.0
