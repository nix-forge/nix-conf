name: Refined import diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: afb0d46dd92b95a8e0a75375812b374d75167b27
          submodules: recursive
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55
      - name: Record immutable source
        run: git rev-parse HEAD
      - name: Run only the import fixture with systemd diagnostics
        run: |
          nix build --option sandbox true --no-link --print-build-logs --impure --expr '
            let
              flake = builtins.getFlake ("git+file://" + builtins.getEnv "PWD" + "?submodules=1&rev=afb0d46dd92b95a8e0a75375812b374d75167b27");
            in flake.checks.x86_64-linux.refined-github-import.overrideAttrs {
              SYSTEMD_LOG_TARGET = "console";
              SYSTEMD_LOG_LEVEL = "debug";
              SYSTEMD_LOG_COLOR = "0";
            }
          '
