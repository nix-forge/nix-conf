name: REA upstream cache availability
on:
  workflow_dispatch:
permissions: {}
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2c7c56eb5a1d3078ef4e31bb2a22509bff2504bc
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55
      - name: Inspect immutable upstream Node and trusted-cache metadata without building
        run: |
          git rev-parse HEAD
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            echo "SYSTEM=$system"
            export CACHE_PROBE_SYSTEM="$system"
            report=$(nix eval --impure --json --expr '
              let
                flake = builtins.getFlake ("git+file://" + builtins.getEnv "PWD" + "?submodules=1&rev=2c7c56eb5a1d3078ef4e31bb2a22509bff2504bc");
                pkgs = import flake.inputs.nixpkgs-apps { system = builtins.getEnv "CACHE_PROBE_SYSTEM"; };
              in {
                nodeVersion = pkgs.nodejs_24.version;
                brotliVersion = pkgs.brotli.version;
                node = pkgs.nodejs_24.outPath;
                drv = pkgs.nodejs_24.drvPath;
              }')
            echo "$report"
            node_path=$(printf '%s' "$report" | python3 -c 'import json,sys; print(json.load(sys.stdin)["node"])')
            cache_hash=${node_path#/nix/store/}
            cache_hash=${cache_hash%%-*}
            curl --fail --silent --show-error "https://cache.nixos.org/$cache_hash.narinfo" > "$system.narinfo"
            grep -E '^(StorePath|NarHash|Sig):' "$system.narinfo"
          done
