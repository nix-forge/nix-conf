name: Recover transient Scorecard failures
on: # zizmor: ignore[dangerous-triggers] Trusted metadata-only recovery, without caller checkout.
  workflow_run:
    workflows: ["OpenSSF Scorecard"]
    types: [completed]
permissions: {}
concurrency:
  group: recover-scorecard-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure'
    permissions:
      actions: write # Retry only verified transient service failures.
      contents: read
    uses: nix-forge/ci/.github/workflows/retry-scorecard.yml@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
    with:
      source-run-id: ${{ format('{0}', github.event.workflow_run.id) }}
