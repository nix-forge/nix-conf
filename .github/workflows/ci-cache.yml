name: Seed reviewed static CI caches
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-cache.yml
      - flake.lock
      - flake/dev/**
      - flake/lint-checks.nix
      - lib/python/notification-process/**
  workflow_dispatch:
permissions: {}
concurrency:
  group: static-ci-cache-seed
  cancel-in-progress: false
jobs:
  seed:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Seed ${{ matrix.scope }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - scope: ci-python
            shell: ciPython
          - scope: ci-lint
            shell: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: nix-forge/ci/actions/setup-nix@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
        with:
          cache: 'true'
          cache-scope: ${{ matrix.scope }}
          cache-write-mode: seed
          cache-restore-compatible: 'true'
      - name: Retain the reviewed tool closure for post-job cache collection
        env:
          DEV_SHELL: ${{ matrix.shell }}
          CACHE_SCOPE: ${{ matrix.scope }}
        run: bash .github/scripts/seed-ci-cache.sh
