name: Reconcile merge queue
on: # zizmor: ignore[dangerous-triggers] Reads API metadata and runs only the default branch's script.
  workflow_run:
    workflows: ["CI Tests", "Dependency Review", "CodeQL", "Auto-merge Dependabot"]
    types: [completed]
  schedule:
    - cron: "17,37,57 * * * *"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Queue validation run whose completion triggered reconciliation.
        type: string
        required: false
permissions: {}
concurrency:
  group: reconcile-merge-queue
  cancel-in-progress: false
jobs:
  reconcile:
    name: Reconcile merge queue
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read # Read validation job results for the queued commit.
      actions: write # Dispatch missing queue validation and inspect workflow runs.
      contents: write # Admit eligible pull requests to the merge queue.
      pull-requests: write # Read and enqueue eligible pull requests.
      statuses: write # Publish verified validation results on the queue commit.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Reconcile passing automation pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_REPO: ${{ github.repository }}
          QUEUE_WORKFLOWS: '["ci.yml", "dependency-review.yml", "codeql.yml"]'
        run: python3 .github/scripts/reconcile-queue.py
