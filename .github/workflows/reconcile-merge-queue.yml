name: Reconcile merge queue
on: # zizmor: ignore[dangerous-triggers] Reads API metadata and runs only the default branch's script.
  workflow_run:
    workflows: ["CI Tests", "Dependency Review", "CodeQL"]
    types: [completed]
  schedule:
    - cron: 17 * * * *
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Queue validation run whose completion triggered reconciliation.
        type: string
        required: false
permissions: {}
concurrency:
  group: reconcile-merge-queue
  cancel-in-progress: false
jobs:
  reconcile:
    name: Reconcile merge queue
    # Completion callbacks handle dispatched queue runs; scans and pushes need no reconciliation.
    if: >-
      github.event_name != 'workflow_run' || contains(fromJSON('["pull_request", "merge_group"]'), github.event.workflow_run.event)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read # Read validation job results for the queued commit.
      actions: write # Dispatch missing queue validation and inspect workflow runs.
      contents: write # Admit eligible pull requests to the merge queue.
      pull-requests: write # Read and enqueue eligible pull requests.
      statuses: write # Publish verified validation results on the queue commit.
    steps:
      - name: Reconcile verified automation
        uses: nix-forge/ci/actions/reconcile-queue@b2e2598e6c7a72e54c38ef1802d6b19c917ce617 # v2.5.1
        with:
          workflows: '["ci.yml", "dependency-review.yml", "codeql.yml"]'
          base-sha-workflows: '["ci.yml"]'
          source-run-id: ${{ inputs.source_run_id }}
