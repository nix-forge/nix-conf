name: Dependency Review
on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base commit or ref to compare.
        required: true
        type: string
      head_ref:
        description: Head commit or ref to compare.
        required: true
        type: string
permissions: {}
jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ inputs.base_ref }}
          head-ref: ${{ inputs.head_ref }}
          fail-on-severity: high
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')
    needs: [dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Notify the trusted queue reconciler
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run reconcile-merge-queue.yml --ref main -f source_run_id="$GITHUB_RUN_ID"; then
              exit 0
            fi
            echo "::warning::Queue completion notification attempt $attempt failed"
            sleep 5
          done
          exit 1
