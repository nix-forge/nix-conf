name: Fuzz CRX extraction
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '31 8 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  crx:
    name: Fuzz CRX extraction
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the CRX converter
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 build --locked --package helium-crx-to-zip
          printf 'CRX_CONVERTER=%s/target/debug/helium-crx-to-zip\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: nix-forge/ci/actions/fuzz-atheris@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
        with:
          target: fuzz/crx_fuzzer.py
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/',
      github.event.repository.default_branch))
    needs: [crx]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
