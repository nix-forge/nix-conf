name: Auto-merge Dependabot
on: # zizmor: ignore[dangerous-triggers] This workflow only calls the merge API and never executes PR code.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
permissions: {}
concurrency:
  group: automerge-dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  enable:
    name: enable
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'nix-forge/nix-conf'
      && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft
      == false
    permissions:
      contents: write # Enable auto-merge for the pull request.
      pull-requests: write # Create or update pull requests and enable auto-merge.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enable squash auto-merge after CI
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash
