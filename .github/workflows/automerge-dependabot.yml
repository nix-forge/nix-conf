name: Auto-merge Dependabot
on: # zizmor: ignore[dangerous-triggers] This workflow only calls the merge API and never executes PR code.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
permissions: {}
concurrency:
  group: automerge-dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  enable:
    name: enable
    permissions:
      contents: write # Update trusted repository automation.
      pull-requests: write # Update pull request metadata.
    uses: nix-forge/ci/.github/workflows/automerge.yml@a75d21dababfd55145e2df1db81f3d2d865bec59 # v1.0.0
