name: Publish guide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: nix-forge/ci/actions/setup-nix@bb1b39a9082f72dc6c7ce596103ce7a5e4d29b01 # v2.8.0
        with:
          cache: 'false'
      - name: Build the guide
        run: |
          nix build --no-write-lock-file --max-jobs 1 --cores 2 .#documentation
          mkdir public-guide
          cp -RL result/. public-guide/
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public-guide
  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # Download the artifact produced by the build job.
      contents: read
      pages: write # Publish the built artifact to GitHub Pages.
      id-token: write # Authenticate the Pages deployment with GitHub OIDC.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
