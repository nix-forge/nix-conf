version: 2
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
      time: "05:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    rebase-strategy: auto
    labels:
      - dependencies
      - submodule
    commit-message:
      prefix: build(deps)
      include: scope
    groups:
      submodules:
        patterns:
          - "*"
  - package-ecosystem: "nix"
    directories:
      - "/"
      - "/flake/dev"
    schedule:
      interval: "weekly"
      day: monday
      time: "05:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    rebase-strategy: auto
    labels:
      - dependencies
      - nix
    commit-message:
      prefix: build(deps)
      include: scope
    groups:
      nix-inputs:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    rebase-strategy: auto
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: build(deps)
      include: scope
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
