files.extend-exclude = [
  # Captured upstream text is evidence, not editable repository prose.
  "docs/assets/hyprland-upstream-local-20260907/**",
  "flake.lock",
  "**/Cargo.lock",
  "**/*.age",
  ".git/**",
  ".opencode/node_modules/**",
]

[default]
# Diff index lines contain object hashes, not natural-language words.
extend-ignore-re = [
  # SHA-256 certificate fingerprints contain hexadecimal octets, not words.
  '\b(?:[0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}\b',
  '(?m)^index [0-9a-f]+\.\.[0-9a-f]+(?: [0-7]+)?$',
  # Base16 theme fields contain RGB values rather than prose.
  '(?m)^\s*base[0-9A-Fa-f]{2}\s*=\s*"[0-9A-Fa-f]{6}";',
]
# Exact generated marker shared by the Git module and its native template.
extend-ignore-identifiers-re = [
  '^lib_escapeShellArg_config_xdg_stateHome_git_privacy_bootstra$',
]

[default.extend-identifiers]
ANC = "ANC"                         # Active noise cancellation.
TharLon = "TharLon"                 # Upstream Burmese font family.
ANDed = "ANDed"                     # Boolean conjunction in nix-seal authorization documentation.
inh = "inh"
relm4 = "relm4"                     # Rust UI crate referenced by the Hyprshell patch.
PnP = "PnP"                         # Windows Plug and Play terminology.
PnPUtil = "PnPUtil"                 # Windows driver installation utility.
Win32_PnPEntity = "Win32_PnPEntity" # Fixed Windows CIM class name.
UPnP = "UPnP"                       # Universal Plug and Play protocol.
enableUPnP = "enableUPnP"           # Upstream Transmission option name.
TsukiHime = "TsukiHime"             # Subtitle provider name in reviewed research evidence.

[default.extend-words]
intoto = "intoto"   # SLSA provenance asset filename suffix.
produkt = "produkt" # Apple's font family and package identifier.
Produkt = "Produkt" # Apple-distributed font family and its PostScript identifiers.
constan = "constan" # Upstream Microsoft font filename, constan.ttf.
ags = "ags"
extens = "extens"
imput = "imput"
wdth = "wdth"
WRONLY = "WRONLY"
nd = "nd"           # Navidrome plugin and authorization-header namespace.
